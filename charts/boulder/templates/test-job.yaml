apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-boulder-test
  annotations:
    "helm.sh/hook": test-success
  labels:
    app: {{ .Release.Name }}-boulder
spec:
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-boulder
    spec:
      containers:
        - name: boulder-test
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "/boulder"
            - "--version"
      restartPolicy: Never
  backoffLimit: 0
