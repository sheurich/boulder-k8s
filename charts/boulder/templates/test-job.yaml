apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-test"
  labels:
    app: {{ .Release.Name }}-boulder
  annotations:
    "helm.sh/hook": test
spec:
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-boulder
    spec:
      containers:
        - name: test
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - "/boulder"
            - "--version"
      restartPolicy: Never
