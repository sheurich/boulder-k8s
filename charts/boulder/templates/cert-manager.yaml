{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "boulder.fullname" . }}-ca-issuer
spec:
  ca:
    secretName: {{ include "boulder.fullname" . }}-ca-key-pair
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ include "boulder.fullname" . }}-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "boulder.fullname" . }}-ca-certificate
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: Boulder Test CA
  secretName: {{ include "boulder.fullname" . }}-ca-key-pair
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: {{ include "boulder.fullname" . }}-selfsigned-issuer
    kind: ClusterIssuer
  subject:
    organizationalUnits:
      - Boulder Integration Test
    organizations:
      - Let's Encrypt
    countries:
      - US
{{- end }}