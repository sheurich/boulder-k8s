mariadb:
  enabled: false
  auth:
    rootPassword: "changeme"
    database: "boulder"
    username: "boulder"
    password: "changeme"

proxysql:
  enabled: false
  auth:
    adminUsername: "admin"
    adminPassword: "changeme"
    monitorUsername: "monitor"
    monitorPassword: "changeme"
  backend:
    host: "boulder-mariadb"
    port: 3306

redis:
  enabled: false
  auth:
    password: "changeme"

consul:
  enabled: false

jaeger:
  enabled: false
