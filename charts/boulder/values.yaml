# Default values for boulder.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: boulder
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

service:
  type: ClusterIP
  port: 4000


config:
  # -- The Boulder configuration to use.
  # This should be a valid JSON configuration for Boulder.
  # See https://github.com/letsencrypt/boulder/blob/main/cmd/boulder-ca/boulder-ca.go
  # for more information.
  boulder:
    # -- The log level for Boulder.
    logLevel: "debug"
    # -- The port for the ACME API.
    port: 4000
    # -- The port for the OCSP responder.
    ocspPort: 4001
    # -- The port for the metrics endpoint.
    metricsPort: 9090
    # -- The directory where Boulder stores its state.
    stateDir: "/var/boulder"
    # -- The directory where Boulder stores its certificates.
    certDir: "/var/boulder/certs"
    # -- The directory where Boulder stores its keys.
    keyDir: "/var/boulder/keys"
    # -- The directory where Boulder stores its logs.
    logDir: "/var/boulder/logs"
    # -- The directory where Boulder stores its ACME accounts.
    acmeAccountDir: "/var/boulder/acme-accounts"
    # -- The directory where Boulder stores its ACME orders.
    acmeOrderDir: "/var/boulder/acme-orders"
    # -- The directory where Boulder stores its ACME challenges.
    acmeChallengeDir: "/var/boulder/acme-challenges"
    # -- The directory where Boulder stores its ACME authorizations.
    acmeAuthzDir: "/var/boulder/acme-authz"
    # -- The directory where Boulder stores its ACME certificates.
    acmeCertDir: "/var/boulder/acme-certs"
    # -- The directory where Boulder stores its ACME certificate status.
    acmeCertStatusDir: "/var/boulder/acme-cert-status"
    # -- The directory where Boulder stores its ACME certificate revocation lists.
    acmeCertRevocationListDir: "/var/boulder/acme-cert-revocation-lists"
    # -- The directory where Boulder stores its ACME certificate revocation list status.
    acmeCertRevocationListStatusDir: "/var/boulder/acme-cert-revocation-list-status"
    # -- The directory where Boulder stores its ACME certificate revocation list entries.
    acmeCertRevocationListEntryDir: "/var/boulder/acme-cert-revocation-list-entries"
    # -- The directory where Boulder stores its ACME certificate revocation list entry status.
    acmeCertRevocationListEntryStatusDir: "/var/boulder/acme-cert-revocation-list-entry-status"
    # -- The directory where Boulder stores its ACME certificate revocation list entry data.
    acmeCertRevocationListEntryDataDir: "/var/boulder/acme-cert-revocation-list-entry-data"
    # -- The directory where Boulder stores its ACME certificate revocation list entry data status.
    acmeCertRevocationListEntryDataStatusDir: "/var/boulder/acme-cert-revocation-list-entry-data-status"
    # -- The directory where Boulder stores its ACME certificate revocation list entry data content.
