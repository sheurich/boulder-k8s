---
# Kind Cluster Configuration for Boulder ACME CA
# Simplified configuration for reliable cluster creation
# EXCLUDES OCSP functionality (deprecated)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: boulder-k8s
nodes:
  - role: control-plane
    extraPortMappings:
      # ACME HTTP endpoint
      - containerPort: 4001
        hostPort: 4001
        protocol: TCP
      # ACME HTTPS endpoint
      - containerPort: 4431
        hostPort: 4431
        protocol: TCP
      # Self-service frontend
      - containerPort: 4003
        hostPort: 4003
        protocol: TCP
      # Ingress controller HTTP
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # Ingress controller HTTPS
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  # Single worker node for Boulder services
  - role: worker
