# Redis configuration for Boulder dev/CI environment
# Uses Bitnami Redis chart

# Override name to create service as redis.boulder.svc.cluster.local
# (Boulder configs expect this name, not redis-master)
fullnameOverride: redis

# Architecture: standalone for dev, sentinel for prod
architecture: standalone

# Authentication
auth:
  enabled: true
  password: boulder-redis-dev

# Master configuration (standalone mode)
master:
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # Port configuration
  containerPorts:
    redis: 6379

# Replica configuration (not used in standalone)
replica:
  replicaCount: 0

# TLS configuration
tls:
  enabled: true
  # Use cert-manager for TLS certs in production
  # For dev, generate self-signed
  authClients: true
  certFilename: tls.crt
  certKeyFilename: tls.key
  certCAFilename: ca.crt

# Metrics for Prometheus
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: boulder

# Service configuration
service:
  type: ClusterIP
  ports:
    redis: 6379

# Pod labels for Boulder network policies
commonLabels:
  app.kubernetes.io/part-of: boulder

---
# Second Redis instance for rate limiting (separate from caching)
# Deploy as separate release: helm install redis-ratelimits bitnami/redis -f values-dev.yaml
