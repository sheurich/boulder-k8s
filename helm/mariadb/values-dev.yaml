# MariaDB configuration for Boulder dev/CI environment
# Uses Bitnami MariaDB chart as simpler alternative to Vitess

# Image configuration - use official mariadb image
image:
  registry: docker.io
  repository: mariadb
  tag: "10.11"

# Architecture: standalone for dev
architecture: standalone

# Authentication
auth:
  rootPassword: boulder-root-dev
  database: boulder_sa_test
  username: boulder
  password: boulder-dev-password

# Primary configuration
primary:
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  configuration: |-
    [mysqld]
    skip-name-resolve
    explicit_defaults_for_timestamp
    basedir=/opt/bitnami/mariadb
    datadir=/bitnami/mariadb/data
    plugin_dir=/opt/bitnami/mariadb/plugin
    port=3306
    socket=/opt/bitnami/mariadb/tmp/mysql.sock
    tmpdir=/opt/bitnami/mariadb/tmp
    max_allowed_packet=16M
    bind-address=0.0.0.0
    pid-file=/opt/bitnami/mariadb/tmp/mysqld.pid
    log-error=/opt/bitnami/mariadb/logs/mysqld.log
    character-set-server=UTF8
    collation-server=utf8_general_ci
    slow_query_log=1
    long_query_time=2

    [client]
    port=3306
    socket=/opt/bitnami/mariadb/tmp/mysql.sock
    default-character-set=UTF8

    [manager]
    port=3306
    socket=/opt/bitnami/mariadb/tmp/mysql.sock
    pid-file=/opt/bitnami/mariadb/tmp/mysqld.pid

# Secondary (replica) configuration - not used in standalone
secondary:
  replicaCount: 0

# Metrics - disabled for dev
metrics:
  enabled: false

# Init database with Boulder schema
initdbScripts:
  init-boulder.sql: |
    -- Create additional databases needed by Boulder
    CREATE DATABASE IF NOT EXISTS boulder_sa_test;
    CREATE DATABASE IF NOT EXISTS incidents_sa_test;

    -- Grant privileges
    GRANT ALL PRIVILEGES ON boulder_sa_test.* TO 'boulder'@'%';
    GRANT ALL PRIVILEGES ON incidents_sa_test.* TO 'boulder'@'%';
    FLUSH PRIVILEGES;

# Service configuration
service:
  type: ClusterIP
  ports:
    mysql: 3306

# Pod labels for Boulder network policies
commonLabels:
  app.kubernetes.io/part-of: boulder
