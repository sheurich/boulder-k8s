apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "softhsm-proxy.fullname" . }}
  labels:
    {{- include "softhsm-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "softhsm-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "softhsm-proxy.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-softhsm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              # Initialize SoftHSM token if not already present
              if [ ! -f /var/lib/softhsm/tokens/.initialized ]; then
                echo "Initializing SoftHSM token..."
                softhsm2-util --init-token --slot 0 \
                  --label "{{ .Values.softhsm.tokenLabel }}" \
                  --pin "{{ .Values.softhsm.pin }}" \
                  --so-pin "{{ .Values.softhsm.soPin }}"
                touch /var/lib/softhsm/tokens/.initialized
                echo "SoftHSM token initialized"
              else
                echo "SoftHSM token already initialized"
              fi
          volumeMounts:
            - name: softhsm-tokens
              mountPath: /var/lib/softhsm/tokens
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sleep
            - infinity
          env:
            - name: SOFTHSM2_CONF
              value: /etc/softhsm/softhsm2.conf
          # For dev: no ports needed, CA accesses token files via shared volume
          livenessProbe:
            exec:
              command: ["softhsm2-util", "--show-slots"]
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["softhsm2-util", "--show-slots"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: softhsm-tokens
              mountPath: /var/lib/softhsm/tokens
            - name: softhsm-conf
              mountPath: /etc/softhsm2.conf
              subPath: softhsm2.conf
      volumes:
        - name: softhsm-tokens
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "softhsm-proxy.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: softhsm-conf
          configMap:
            name: {{ include "softhsm-proxy.fullname" . }}-config
