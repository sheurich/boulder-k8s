name: Test

on:
  push:
  pull_request:

jobs:
  test-proxysql:
    name: Test (ProxySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          # Remove pre-installed software to free up disk space
          # This is necessary for Kind clusters with multiple large images
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build boulder image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: boulder:latest
          cache-from: type=gha,scope=boulder
          cache-to: type=gha,mode=max,scope=boulder

      - name: Build boulder-tools image
        uses: docker/build-push-action@v6
        with:
          context: boulder/test/boulder-tools
          load: true
          tags: letsencrypt/boulder-tools:latest
          cache-from: type=gha,scope=boulder-tools
          cache-to: type=gha,mode=max,scope=boulder-tools
          build-args: GO_VERSION=1.25.5

      - name: Pull dependency images
        run: |
          docker pull mysql:8.4
          docker pull proxysql/proxysql:2.7.2

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.26.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Run tests (ProxySQL)
        env:
          SKIP_IMAGE_BUILD: "true"
        run: ./scripts/test.sh --setup

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "==> Pod status:"
          kubectl get pods -n boulder -o wide || true
          echo ""
          echo "==> Recent events:"
          kubectl get events -n boulder --sort-by='.lastTimestamp' | tail -50 || true
          echo ""
          echo "==> Failed pod logs:"
          for pod in $(kubectl get pods -n boulder --no-headers | grep -v Running | grep -v Completed | awk '{print $1}'); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n boulder --tail=100 || true
          done

  test-vitess:
    name: Test (Vitess)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          # Remove pre-installed software to free up disk space
          # This is necessary for Kind clusters with multiple large images
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build boulder image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: boulder:latest
          cache-from: type=gha,scope=boulder
          cache-to: type=gha,mode=max,scope=boulder

      - name: Build boulder-tools image
        uses: docker/build-push-action@v6
        with:
          context: boulder/test/boulder-tools
          load: true
          tags: letsencrypt/boulder-tools:latest
          cache-from: type=gha,scope=boulder-tools
          cache-to: type=gha,mode=max,scope=boulder-tools
          build-args: GO_VERSION=1.25.5

      - name: Patch vtcombo MySQL timeout
        run: |
          # vtcombo has hardcoded 30s MySQL startup timeout in startMysqld()
          # Patch the Dockerfile to increase it to 120s before building
          cd boulder/test/vtcomboserver

          # Add commands to show the source before/after and perform the patch
          sed -i '/^RUN git clone/a\
          \
          # CI FIX: Show and patch MySQL startup timeout from 30s to 120s\
          RUN echo "==> Original timeout line:" && grep -n "time.Second" go/cmd/vtcombo/cli/main.go | head -5\
          RUN sed -i "s/30\\*time\\.Second/120*time.Second/g" go/cmd/vtcombo/cli/main.go\
          RUN echo "==> Patched timeout line:" && grep -n "time.Second" go/cmd/vtcombo/cli/main.go | head -5' Dockerfile

          echo "==> Patched Dockerfile:"
          grep -A4 "CI FIX" Dockerfile

      - name: Build vtcomboserver image
        uses: docker/build-push-action@v6
        with:
          context: boulder/test/vtcomboserver
          load: true
          tags: letsencrypt/boulder-vtcomboserver:latest
          # Disable cache - patched Dockerfile must be used
          no-cache: true
          build-args: VITESS_TAG=v23.0.0

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.26.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Run tests (Vitess)
        env:
          OVERLAY: dev-vitess
          SKIP_IMAGE_BUILD: "true"
        run: ./scripts/test.sh --setup

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "==> Pod status:"
          kubectl get pods -n boulder -o wide || true
          echo ""
          echo "==> Vitess deployment env vars:"
          kubectl get deployment vitess -n boulder -o jsonpath='{.spec.template.spec.containers[0].env}' 2>&1 | jq . || true
          echo ""
          echo "==> Recent events:"
          kubectl get events -n boulder --sort-by='.lastTimestamp' | tail -50 || true
          echo ""
          echo "==> Vitess pod full logs (first 200 lines):"
          kubectl logs -n boulder -l app.kubernetes.io/name=vitess --tail=-1 2>&1 | head -200 || true
          echo ""
          echo "==> Failed pod logs (last 100 lines each):"
          for pod in $(kubectl get pods -n boulder --no-headers | grep -v Running | grep -v Completed | awk '{print $1}'); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n boulder --tail=100 || true
          done

  validate-manifests:
    name: Validate Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate manifests
        run: ./scripts/validate-manifests.sh
