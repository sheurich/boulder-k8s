name: Test

on:
  push:
  pull_request:

jobs:
  test-proxysql:
    name: Test (ProxySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          # Remove pre-installed software to free up disk space
          # This is necessary for Kind clusters with multiple large images
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build boulder image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: boulder:latest
          cache-from: type=gha,scope=boulder
          cache-to: type=gha,mode=max,scope=boulder

      - name: Build boulder-tools image
        uses: docker/build-push-action@v6
        with:
          context: boulder/test/boulder-tools
          load: true
          tags: letsencrypt/boulder-tools:latest
          cache-from: type=gha,scope=boulder-tools
          cache-to: type=gha,mode=max,scope=boulder-tools
          build-args: GO_VERSION=1.25.5

      - name: Pull dependency images
        run: |
          docker pull mysql:8.4
          docker pull proxysql/proxysql:2.7.2

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.26.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Run tests (ProxySQL)
        env:
          SKIP_IMAGE_BUILD: "true"
        run: ./scripts/test.sh --setup

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "==> Pod status:"
          kubectl get pods -n boulder -o wide || true
          echo ""
          echo "==> Recent events:"
          kubectl get events -n boulder --sort-by='.lastTimestamp' | tail -50 || true
          echo ""
          echo "==> Failed pod logs:"
          for pod in $(kubectl get pods -n boulder --no-headers | grep -v Running | grep -v Completed | awk '{print $1}'); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n boulder --tail=100 || true
          done

  test-vitess:
    name: Test (Vitess)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          # Remove pre-installed software to free up disk space
          # This is necessary for Kind clusters with multiple large images
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build boulder image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: boulder:latest
          cache-from: type=gha,scope=boulder
          cache-to: type=gha,mode=max,scope=boulder

      - name: Build boulder-tools image
        uses: docker/build-push-action@v6
        with:
          context: boulder/test/boulder-tools
          load: true
          tags: letsencrypt/boulder-tools:latest
          cache-from: type=gha,scope=boulder-tools
          cache-to: type=gha,mode=max,scope=boulder-tools
          build-args: GO_VERSION=1.25.5

      - name: Patch vtcomboserver for CI
        run: |
          # Patch run.sh to add --init-timeout flag for slow CI runners
          # MySQL can take longer than 1m default timeout to start in CI
          cd boulder/test/vtcomboserver
          # Add debug output at startup
          sed -i '/^\/vt\/setup_vschema_folder.sh/i echo "[vtcombo-debug] VTCOMBO_INIT_TIMEOUT=${VTCOMBO_INIT_TIMEOUT:-5m}"' run.sh
          # Add --init-timeout flag
          sed -i 's|/vt/bin/vtcombo \\|/vt/bin/vtcombo \\\n  --init-timeout "${VTCOMBO_INIT_TIMEOUT:-5m}" \\|' run.sh
          # Show the patched vtcombo invocation
          echo "==> Patched run.sh vtcombo command:"
          grep -A5 "vtcombo" run.sh | head -20

      - name: Build vtcomboserver image
        uses: docker/build-push-action@v6
        with:
          context: boulder/test/vtcomboserver
          load: true
          tags: letsencrypt/boulder-vtcomboserver:latest
          # Disable cache - patched run.sh must be in the image
          no-cache: true
          build-args: VITESS_TAG=v23.0.0

      - name: Verify vtcomboserver image
        run: |
          # Confirm the patched run.sh is in the built image
          echo "==> Verifying init-timeout is in built image:"
          docker run --rm letsencrypt/boulder-vtcomboserver:latest grep -o "init-timeout" /vt/run.sh || echo "ERROR: init-timeout not found in image!"

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.26.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Run tests (Vitess)
        env:
          OVERLAY: dev-vitess
          SKIP_IMAGE_BUILD: "true"
        run: ./scripts/test.sh --setup

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "==> Pod status:"
          kubectl get pods -n boulder -o wide || true
          echo ""
          echo "==> Vitess deployment env vars:"
          kubectl get deployment vitess -n boulder -o jsonpath='{.spec.template.spec.containers[0].env}' 2>&1 | jq . || true
          echo ""
          echo "==> Recent events:"
          kubectl get events -n boulder --sort-by='.lastTimestamp' | tail -50 || true
          echo ""
          echo "==> Vitess pod full logs (first 200 lines):"
          kubectl logs -n boulder -l app.kubernetes.io/name=vitess --tail=-1 2>&1 | head -200 || true
          echo ""
          echo "==> Failed pod logs (last 100 lines each):"
          for pod in $(kubectl get pods -n boulder --no-headers | grep -v Running | grep -v Completed | awk '{print $1}'); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n boulder --tail=100 || true
          done

  validate-manifests:
    name: Validate Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate manifests
        run: ./scripts/validate-manifests.sh
