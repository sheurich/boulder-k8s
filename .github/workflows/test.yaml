name: Test

on:
  push:
  pull_request:

jobs:
  test-proxysql:
    name: Test (ProxySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          # Remove pre-installed software to free up disk space
          # This is necessary for Kind clusters with multiple large images
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.26.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Run tests (ProxySQL)
        run: ./scripts/test.sh --setup

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "==> Pod status:"
          kubectl get pods -n boulder -o wide || true
          echo ""
          echo "==> Recent events:"
          kubectl get events -n boulder --sort-by='.lastTimestamp' | tail -50 || true
          echo ""
          echo "==> Failed pod logs:"
          for pod in $(kubectl get pods -n boulder --no-headers | grep -v Running | grep -v Completed | awk '{print $1}'); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n boulder --tail=100 || true
          done

  test-vitess:
    name: Test (Vitess)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          # Remove pre-installed software to free up disk space
          # This is necessary for Kind clusters with multiple large images
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.26.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Run tests (Vitess)
        env:
          OVERLAY: dev-vitess
        run: ./scripts/test.sh --setup

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "==> Pod status:"
          kubectl get pods -n boulder -o wide || true
          echo ""
          echo "==> Recent events:"
          kubectl get events -n boulder --sort-by='.lastTimestamp' | tail -50 || true
          echo ""
          echo "==> Failed pod logs:"
          for pod in $(kubectl get pods -n boulder --no-headers | grep -v Running | grep -v Completed | awk '{print $1}'); do
            echo "--- $pod ---"
            kubectl logs "$pod" -n boulder --tail=100 || true
          done

  validate-manifests:
    name: Validate Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate manifests
        run: ./scripts/validate-manifests.sh
