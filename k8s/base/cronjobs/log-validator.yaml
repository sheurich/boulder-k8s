apiVersion: batch/v1
kind: CronJob
metadata:
  name: boulder-log-validator
  labels:
    app.kubernetes.io/name: boulder-log-validator
    app.kubernetes.io/component: compliance
spec:
  schedule: "0 * * * *"  # Every hour
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: boulder-log-validator
            app.kubernetes.io/component: compliance
        spec:
          restartPolicy: OnFailure
          containers:
            - name: log-validator
              image: letsencrypt/boulder:latest
              args:
                - boulder
                - log-validator
                - --config
                - /config/log-validator.json
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: boulder-log-validator-config
