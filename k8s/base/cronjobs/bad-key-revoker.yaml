apiVersion: batch/v1
kind: CronJob
metadata:
  name: boulder-bad-key-revoker
  labels:
    app.kubernetes.io/name: boulder-bad-key-revoker
    app.kubernetes.io/component: compliance
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: boulder-bad-key-revoker
            app.kubernetes.io/component: compliance
        spec:
          restartPolicy: OnFailure
          containers:
            - name: bad-key-revoker
              image: letsencrypt/boulder:latest
              args:
                - boulder
                - bad-key-revoker
                - --config
                - /config/bad-key-revoker.json
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: ipki-ca
                  mountPath: /certs/ipki/ca.crt
                  subPath: ca.crt
                  readOnly: true
                - name: ipki-service
                  mountPath: /certs/ipki/bad-key-revoker
                  readOnly: true
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: boulder-bad-key-revoker-config
            - name: ipki-ca
              secret:
                secretName: boulder-internal-ca
            - name: ipki-service
              secret:
                secretName: boulder-bad-key-revoker-grpc-tls
            - name: secrets
              secret:
                secretName: boulder-bad-key-revoker-secrets
