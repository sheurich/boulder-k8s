apiVersion: batch/v1
kind: CronJob
metadata:
  name: boulder-cert-checker
  labels:
    app.kubernetes.io/name: boulder-cert-checker
    app.kubernetes.io/component: compliance
spec:
  schedule: "30 */4 * * *"  # Every 4 hours at :30
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: boulder-cert-checker
            app.kubernetes.io/component: compliance
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cert-checker
              image: letsencrypt/boulder:latest
              args:
                - boulder
                - cert-checker
                - --config
                - /config/cert-checker.json
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: boulder-cert-checker-config
            - name: secrets
              secret:
                secretName: boulder-cert-checker-secrets
