apiVersion: batch/v1
kind: Job
metadata:
  name: boulder-db-migrate
  labels:
    app.kubernetes.io/name: boulder-db-migrate
    app.kubernetes.io/component: bootstrap
  annotations:
    # Helm hook for automatic migration on install/upgrade
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boulder-db-migrate
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Wait for ProxySQL to be ready (which waits for MySQL)
        - name: wait-for-db
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              echo "Waiting for ProxySQL..."
              until nc -z proxysql.boulder.svc.cluster.local 6033; do
                sleep 2
              done
              echo "ProxySQL is ready"
        # Clone Boulder source for migration SQL files
        - name: clone-boulder
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              git clone --depth 1 --branch v0.20251216.0 https://github.com/letsencrypt/boulder.git /boulder
          volumeMounts:
            - name: boulder-source
              mountPath: /boulder
      containers:
        - name: db-migrate
          # Boulder tools image includes sql-migrate
          image: letsencrypt/boulder-tools:latest
          workingDir: /boulder/sa/db
          command:
            - sh
            - -c
            - |
              set -ex
              echo "==> Debug info"
              echo "Working dir: $(pwd)"
              ls -la
              echo "==> Config file:"
              cat /config/dbconfig.yml
              echo "==> Testing ProxySQL connectivity..."
              nc -zv proxysql 6033 || echo "ProxySQL not reachable"
              echo "==> Running Boulder SA migrations..."
              sql-migrate up -config=/config/dbconfig.yml -env=boulder_sa_test
              echo "==> Running Incidents SA migrations..."
              sql-migrate up -config=/config/dbconfig.yml -env=incidents_sa_test
              echo "==> Migrations complete"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: boulder-source
              mountPath: /boulder
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boulder-db-migrate-config
        - name: boulder-source
          # In dev, we need Boulder source for migration SQL files
          # Production would use an init container to clone the repo
          emptyDir: {}
