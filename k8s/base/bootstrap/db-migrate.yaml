apiVersion: batch/v1
kind: Job
metadata:
  name: boulder-db-migrate
  labels:
    app.kubernetes.io/name: boulder-db-migrate
    app.kubernetes.io/component: bootstrap
  annotations:
    # Helm hook for automatic migration on install/upgrade
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boulder-db-migrate
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Wait for MySQL to be ready with TLS (direct connection for migrations)
        - name: wait-for-db
          image: mysql:8.4
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL with TLS..."
              attempt=1
              max_attempts=24  # Reduced: MySQL readiness probe now verifies TLS
              # Wait for MySQL to accept TLS connections (--ssl-mode=REQUIRED for MySQL 8.4+)
              until mysql -h mysql.boulder.svc.cluster.local -u root --ssl-mode=REQUIRED -e "SELECT 1" 2>&1; do
                if [ $attempt -ge $max_attempts ]; then
                  echo "ERROR: MySQL TLS connection failed after $max_attempts attempts"
                  exit 1
                fi
                echo "  Attempt $attempt/$max_attempts failed, retrying in 5s..."
                attempt=$((attempt + 1))
                sleep 5
              done
              echo "MySQL is ready with TLS"
        # Copy Boulder SQL files from boulder image (faster than git clone)
        - name: copy-sql-files
          image: boulder:latest
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              echo "Copying Boulder SQL migration files..."
              cp -r /opt/boulder/* /boulder/
              echo "SQL files ready"
          volumeMounts:
            - name: boulder-source
              mountPath: /boulder
      containers:
        - name: db-migrate
          # Boulder tools image includes sql-migrate
          image: letsencrypt/boulder-tools:latest
          workingDir: /boulder/sa/db
          command:
            - sh
            - -c
            - |
              set -x
              # Trap to capture errors and flush logs
              trap 'echo "==> ERROR: Command failed with exit code $?"; sleep 5' EXIT
              echo "==> Debug info"
              echo "Working dir: $(pwd)"
              ls -la
              echo "==> Config file:"
              cat /config/dbconfig.yml
              echo "==> Testing MySQL connectivity..."
              nc -zv mysql 3306 || { echo "MySQL not reachable"; exit 1; }
              echo "==> Running Boulder SA migrations..."
              sql-migrate up -config=/config/dbconfig.yml -env=boulder_sa_test || { echo "Boulder SA migration failed"; exit 1; }
              echo "==> Running Incidents SA migrations..."
              sql-migrate up -config=/config/dbconfig.yml -env=incidents_sa_test || { echo "Incidents SA migration failed"; exit 1; }
              echo "==> Migrations complete"
              trap - EXIT
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: boulder-source
              mountPath: /boulder
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boulder-db-migrate-config
        - name: boulder-source
          # In dev, we need Boulder source for migration SQL files
          # Production would use an init container to clone the repo
          emptyDir: {}
