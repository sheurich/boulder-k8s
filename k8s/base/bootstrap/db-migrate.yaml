apiVersion: batch/v1
kind: Job
metadata:
  name: boulder-db-migrate
  labels:
    app.kubernetes.io/name: boulder-db-migrate
    app.kubernetes.io/component: bootstrap
  annotations:
    # Helm hook for automatic migration on install/upgrade
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boulder-db-migrate
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migrate
          image: letsencrypt/boulder:latest
          args:
            - boulder-sa
            - --config
            - /config/sa.json
            - --db-connect
            - $(DB_CONNECT)
          env:
            - name: DB_CONNECT
              valueFrom:
                secretKeyRef:
                  name: boulder-db-credentials
                  key: connection-string
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boulder-sa-config
