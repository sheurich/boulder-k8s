# Remote Validation Authority 1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-rva1
  labels:
    app.kubernetes.io/name: boulder-rva1
    app.kubernetes.io/component: remote-validation-authority
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boulder-rva1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boulder-rva1
        app.kubernetes.io/component: remote-validation-authority
    spec:
      containers:
        - name: boulder-rva
          image: letsencrypt/boulder:latest
          args:
            - boulder
            - remoteva
            - --config
            - /config/remoteva-a.json
          ports:
            - name: grpc
              containerPort: 9097
              protocol: TCP
            - name: metrics
              containerPort: 8018
              protocol: TCP
          livenessProbe:
            grpc:
              port: 9097
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9097
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: ipki-ca
              mountPath: /certs/ipki/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: ipki-service
              mountPath: /certs/ipki/rva1
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boulder-rva1-config
        - name: ipki-ca
          secret:
            secretName: boulder-internal-ca
        - name: ipki-service
          secret:
            secretName: boulder-rva1-grpc-tls
---
apiVersion: v1
kind: Service
metadata:
  name: boulder-rva1
  labels:
    app.kubernetes.io/name: boulder-rva1
    app.kubernetes.io/component: remote-validation-authority
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9097
      targetPort: grpc
    - name: metrics
      port: 8018
      targetPort: metrics
  selector:
    app.kubernetes.io/name: boulder-rva1
---
