apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-crl-storer
  labels:
    app.kubernetes.io/name: boulder-crl-storer
    app.kubernetes.io/component: crl-storer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boulder-crl-storer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boulder-crl-storer
        app.kubernetes.io/component: crl-storer
    spec:
      containers:
        - name: boulder-crl-storer
          image: letsencrypt/boulder:latest
          args:
            - boulder
            - crl-storer
            - --config
            - /config/crl-storer.json
          ports:
            - name: grpc
              containerPort: 9109
              protocol: TCP
            - name: metrics
              containerPort: 8024
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /debug/vars
              port: 9667
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /debug/vars
              port: 9667
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: ipki-ca
              mountPath: /certs/ipki/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: ipki-service
              mountPath: /certs/ipki/crl-storer
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boulder-crl-storer-config
        - name: ipki-ca
          secret:
            secretName: boulder-internal-ca
        - name: ipki-service
          secret:
            secretName: boulder-crl-storer-grpc-tls
---
apiVersion: v1
kind: Service
metadata:
  name: boulder-crl-storer
  labels:
    app.kubernetes.io/name: boulder-crl-storer
    app.kubernetes.io/component: crl-storer
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9109
      targetPort: grpc
    - name: metrics
      port: 8024
      targetPort: metrics
  selector:
    app.kubernetes.io/name: boulder-crl-storer
