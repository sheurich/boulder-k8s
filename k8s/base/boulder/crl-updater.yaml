apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-crl-updater
  labels:
    app.kubernetes.io/name: boulder-crl-updater
    app.kubernetes.io/component: crl-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boulder-crl-updater
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boulder-crl-updater
        app.kubernetes.io/component: crl-updater
    spec:
      containers:
        - name: boulder-crl-updater
          image: letsencrypt/boulder:latest
          args:
            - boulder
            - crl-updater
            - --config
            - /config/crl-updater.json
          ports:
            - name: metrics
              containerPort: 8023
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: ipki-ca
              mountPath: /certs/ipki/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: ipki-service
              mountPath: /certs/ipki/crl-updater
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boulder-crl-updater-config
        - name: ipki-ca
          secret:
            secretName: boulder-internal-ca
        - name: ipki-service
          secret:
            secretName: boulder-crl-updater-grpc-tls
---
apiVersion: v1
kind: Service
metadata:
  name: boulder-crl-updater
  labels:
    app.kubernetes.io/name: boulder-crl-updater
    app.kubernetes.io/component: crl-updater
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 8023
      targetPort: metrics
  selector:
    app.kubernetes.io/name: boulder-crl-updater
