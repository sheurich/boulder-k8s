apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-ra
  labels:
    app.kubernetes.io/name: boulder-ra
    app.kubernetes.io/component: registration-authority
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boulder-ra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boulder-ra
        app.kubernetes.io/component: registration-authority
    spec:
      containers:
        - name: boulder-ra
          image: letsencrypt/boulder:latest
          args:
            - boulder-ra
            - --config
            - /config/ra.json
          ports:
            - name: grpc
              containerPort: 9094
              protocol: TCP
            - name: metrics
              containerPort: 8012
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /debug/vars
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /debug/vars
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: ipki-ca
              mountPath: /certs/ipki/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: ipki-service
              mountPath: /certs/ipki/ra
              readOnly: true
            - name: webpki
              mountPath: /certs/webpki
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boulder-ra-config
        - name: ipki-ca
          secret:
            secretName: boulder-internal-ca
        - name: ipki-service
          secret:
            secretName: boulder-ra-grpc-tls
        - name: webpki
          configMap:
            name: boulder-webpki-certs
        - name: secrets
          secret:
            secretName: boulder-ra-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: boulder-ra
  labels:
    app.kubernetes.io/name: boulder-ra
    app.kubernetes.io/component: registration-authority
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9094
      targetPort: grpc
    - name: metrics
      port: 8012
      targetPort: metrics
  selector:
    app.kubernetes.io/name: boulder-ra
