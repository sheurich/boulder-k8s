apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-wfe2
  labels:
    app.kubernetes.io/name: boulder-wfe2
    app.kubernetes.io/component: web-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boulder-wfe2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boulder-wfe2
        app.kubernetes.io/component: web-frontend
    spec:
      containers:
        - name: boulder-wfe2
          image: letsencrypt/boulder:latest
          args:
            - boulder-wfe2
            - --config
            - /config/wfe2.json
          ports:
            - name: http
              containerPort: 4001
              protocol: TCP
            - name: https
              containerPort: 4431
              protocol: TCP
            - name: metrics
              containerPort: 8013
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /build
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /build
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: ipki-ca
              mountPath: /certs/ipki/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: ipki-service
              mountPath: /certs/ipki/wfe2
              readOnly: true
            - name: web-tls
              mountPath: /certs/web
              readOnly: true
            - name: webpki
              mountPath: /certs/webpki
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boulder-wfe2-config
        - name: ipki-ca
          secret:
            secretName: boulder-internal-ca
        - name: ipki-service
          secret:
            secretName: boulder-wfe2-grpc-tls
        - name: web-tls
          secret:
            secretName: boulder-wfe2-web-tls
        - name: webpki
          configMap:
            name: boulder-webpki-certs
        - name: secrets
          secret:
            secretName: boulder-wfe2-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: boulder-wfe2
  labels:
    app.kubernetes.io/name: boulder-wfe2
    app.kubernetes.io/component: web-frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4001
      targetPort: http
    - name: https
      port: 4431
      targetPort: https
    - name: metrics
      port: 8013
      targetPort: metrics
  selector:
    app.kubernetes.io/name: boulder-wfe2
---
# LoadBalancer for external ACME access
apiVersion: v1
kind: Service
metadata:
  name: boulder-wfe2-external
  labels:
    app.kubernetes.io/name: boulder-wfe2
    app.kubernetes.io/component: web-frontend
spec:
  type: LoadBalancer
  ports:
    - name: https
      port: 443
      targetPort: https
  selector:
    app.kubernetes.io/name: boulder-wfe2
