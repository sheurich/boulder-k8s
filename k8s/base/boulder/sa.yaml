apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-sa
  labels:
    app.kubernetes.io/name: boulder-sa
    app.kubernetes.io/component: storage-authority
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: boulder-sa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boulder-sa
        app.kubernetes.io/component: storage-authority
    spec:
      containers:
        - name: boulder-sa
          image: letsencrypt/boulder:latest
          args:
            - boulder-sa
            - --config
            - /config/sa.json
          ports:
            - name: grpc
              containerPort: 9095
              protocol: TCP
            - name: metrics
              containerPort: 8017
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /debug/vars
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /debug/vars
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: ipki-ca
              mountPath: /certs/ipki/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: ipki-service
              mountPath: /certs/ipki/sa
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: boulder-sa-config
        - name: ipki-ca
          secret:
            secretName: boulder-internal-ca
        - name: ipki-service
          secret:
            secretName: boulder-sa-grpc-tls
        - name: secrets
          secret:
            secretName: boulder-sa-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: boulder-sa
  labels:
    app.kubernetes.io/name: boulder-sa
    app.kubernetes.io/component: storage-authority
spec:
  type: ClusterIP
  ports:
    - name: grpc
      port: 9095
      targetPort: grpc
    - name: metrics
      port: 8017
      targetPort: metrics
  selector:
    app.kubernetes.io/name: boulder-sa
