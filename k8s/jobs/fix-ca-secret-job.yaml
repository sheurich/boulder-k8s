# Job to fix CA secret format for MariaDB operator compatibility
apiVersion: batch/v1
kind: Job
metadata:
  name: fix-ca-secret-job
  namespace: default
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: ca-secret-fixer
      restartPolicy: Never
      containers:
      - name: fix-ca-secret
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          
          echo "Waiting for boulder-ca-secret to be created by cert-manager..."
          while ! kubectl get secret boulder-ca-secret >/dev/null 2>&1; do
            echo "Waiting for secret..."
            sleep 5
          done
          
          echo "Checking if ca.key already exists..."
          if kubectl get secret boulder-ca-secret -o jsonpath='{.data.ca\.key}' 2>/dev/null | grep -q .; then
            echo "ca.key already exists, nothing to do"
            exit 0
          fi
          
          echo "Adding ca.key field to boulder-ca-secret..."
          TLS_KEY=$(kubectl get secret boulder-ca-secret -o jsonpath='{.data.tls\.key}')
          
          kubectl patch secret boulder-ca-secret --type=merge -p "{
            \"data\": {
              \"ca.key\": \"$TLS_KEY\"
            }
          }"
          
          echo "Successfully added ca.key to boulder-ca-secret"
---
# ServiceAccount and RBAC for the fix job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ca-secret-fixer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: ca-secret-fixer
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ca-secret-fixer
  namespace: default
subjects:
- kind: ServiceAccount
  name: ca-secret-fixer
  namespace: default
roleRef:
  kind: Role
  name: ca-secret-fixer
  apiGroup: rbac.authorization.k8s.io