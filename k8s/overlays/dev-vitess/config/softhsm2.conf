# SoftHSM v2 configuration for Boulder CA
# Token directory is mounted from emptyDir (populated by init container)

directories.tokendir = /var/lib/softhsm/tokens/
objectstore.backend = file

# Log level (0=NONE, 1=ERROR, 2=WARNING, 3=INFO, 4=DEBUG)
log.level = INFO

# Slots configuration
# Slot 0 is auto-created when token is initialized
slots.removable = false
slots.mechanisms = ALL
