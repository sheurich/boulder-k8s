# Patch CA deployment to use SoftHSM directly (sidecar pattern)
# SoftHSM tokens are initialized by PKI ceremony and stored in a Secret.
# Init container restores tokens to emptyDir, CA loads libsofthsm2.so directly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-ca
spec:
  template:
    spec:
      containers:
        - name: boulder-ca
          env:
            # SoftHSM config file location
            - name: SOFTHSM2_CONF
              value: /etc/softhsm/softhsm2.conf
          volumeMounts:
            # SoftHSM token storage (populated by init container)
            - name: softhsm-tokens
              mountPath: /var/lib/softhsm/tokens
            # SoftHSM config file
            - name: softhsm-config
              mountPath: /etc/softhsm
              readOnly: true
            # WebPKI certificates (intermediates need public keys for pkcs11.json)
            - name: webpki-certs
              mountPath: /certs/webpki
              readOnly: true
      # Init container restores SoftHSM tokens from Secret
      # Note: Image inherited from deployment, overridden by image-pull-policy patch
      initContainers:
        - name: restore-softhsm-tokens
          image: boulder:latest
          imagePullPolicy: Never
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Restoring SoftHSM tokens from secret..."
              # Extract to temp directory first to avoid permission issues with BusyBox tar
              mkdir -p /tmp/softhsm-extract
              cd /tmp/softhsm-extract
              tar xzf /secret-tokens/softhsm-tokens.tar.gz 2>/dev/null || true
              # Copy files to destination (ignoring permission errors on metadata)
              cp -r /tmp/softhsm-extract/tokens/* /var/lib/softhsm/tokens/ 2>/dev/null || \
                cp -a /tmp/softhsm-extract/tokens/* /var/lib/softhsm/tokens/ 2>/dev/null || \
                (cd /tmp/softhsm-extract && find tokens -type f -exec cp {} /var/lib/softhsm/tokens/ \;)
              # Fix permissions - CA runs as boulder user (uid 1000)
              chown -R 1000:1000 /var/lib/softhsm/tokens
              chmod -R 700 /var/lib/softhsm/tokens
              echo "SoftHSM tokens restored:"
              ls -la /var/lib/softhsm/tokens/
              # Verify tokens are accessible
              export SOFTHSM2_CONF=/etc/softhsm/softhsm2.conf
              softhsm2-util --show-slots
          volumeMounts:
            - name: softhsm-tokens
              mountPath: /var/lib/softhsm/tokens
            - name: softhsm-token-secret
              mountPath: /secret-tokens
              readOnly: true
            - name: softhsm-config
              mountPath: /etc/softhsm
              readOnly: true
      volumes:
        # EmptyDir for SoftHSM token storage at runtime
        - name: softhsm-tokens
          emptyDir: {}
        # Secret containing SoftHSM token archive (created by PKI ceremony)
        - name: softhsm-token-secret
          secret:
            secretName: boulder-softhsm-tokens
        # SoftHSM configuration
        - name: softhsm-config
          configMap:
            name: boulder-softhsm-config
        # WebPKI certificates
        - name: webpki-certs
          configMap:
            name: boulder-webpki-certs
