# Patch db-migrate job to wait for Vitess
apiVersion: batch/v1
kind: Job
metadata:
  name: boulder-db-migrate
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-db
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              echo "Waiting for Vitess..."
              until nc -z vitess.boulder.svc.cluster.local 3306; do
                sleep 2
              done
              echo "Vitess is ready"
      containers:
        - name: db-migrate
          # Use boulder-tools (built locally)
          image: letsencrypt/boulder-tools:latest
          imagePullPolicy: IfNotPresent
          workingDir: /boulder/sa/db
          command:
            - sh
            - -c
            - |
              set -ex
              # Trap to capture errors and ensure logs are flushed
              trap 'echo "==> ERROR: Command failed with exit code $?"; sleep 10' EXIT

              echo "==> Debug info"
              echo "Working dir: $(pwd)"
              ls -la
              echo "==> Config file:"
              cat /config/dbconfig.yml

              migrate_with_retry() {
                local name="$1"
                local attempts=60
                local delay=2
                local success=0

                echo "==> Running ${name} migrations with retry..."
                for attempt in $(seq 1 "${attempts}"); do
                  if sql-migrate up -config=/config/dbconfig.yml -env="${name}"; then
                    success=1
                    break
                  fi
                  echo "Vitess not ready for ${name} (attempt ${attempt}/${attempts})"
                  sleep "${delay}"
                done

                if [ "${success}" -ne 1 ]; then
                  echo "Migrations failed for ${name} after ${attempts} attempts" >&2
                  return 1
                fi
              }

              migrate_with_retry boulder_sa_test
              migrate_with_retry incidents_sa_test
              echo "==> Migrations complete"
              trap - EXIT
