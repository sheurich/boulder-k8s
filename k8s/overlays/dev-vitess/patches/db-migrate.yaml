# Patch db-migrate job to wait for Vitess
apiVersion: batch/v1
kind: Job
metadata:
  name: boulder-db-migrate
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-db
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              echo "Waiting for Vitess..."
              until nc -z vitess.boulder.svc.cluster.local 3306; do
                sleep 2
              done
              echo "Vitess is ready"
      containers:
        - name: db-migrate
          # Use boulder-tools (built locally)
          image: letsencrypt/boulder-tools:latest
          imagePullPolicy: IfNotPresent
          workingDir: /boulder/sa/db
          command:
            - sh
            - -c
            - |
              set -e
              echo "Running Boulder SA migrations..."
              sql-migrate up -config=/config/dbconfig.yml -env=boulder_sa_test
              echo "Running Incidents SA migrations..."
              sql-migrate up -config=/config/dbconfig.yml -env=incidents_sa_test
              echo "Migrations complete"
