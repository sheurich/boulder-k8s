# Mock Certificate Transparency log server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ct-test-srv
  labels:
    app.kubernetes.io/name: ct-test-srv
    app.kubernetes.io/component: test-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ct-test-srv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ct-test-srv
        app.kubernetes.io/component: test-mock
    spec:
      containers:
        - name: ct-test-srv
          image: letsencrypt/boulder:latest
          command:
            - ct-test-srv
          args:
            - -config
            - /config/ct-test-srv.json
          ports:
            - name: ct-4600
              containerPort: 4600
              protocol: TCP
            - name: ct-4601
              containerPort: 4601
              protocol: TCP
            - name: ct-4602
              containerPort: 4602
              protocol: TCP
            - name: ct-4603
              containerPort: 4603
              protocol: TCP
            - name: ct-4604
              containerPort: 4604
              protocol: TCP
            - name: ct-4605
              containerPort: 4605
              protocol: TCP
            - name: ct-4606
              containerPort: 4606
              protocol: TCP
            - name: ct-4607
              containerPort: 4607
              protocol: TCP
            - name: ct-4608
              containerPort: 4608
              protocol: TCP
            - name: ct-4609
              containerPort: 4609
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: ct-test-srv-config
---
apiVersion: v1
kind: Service
metadata:
  name: ct-test-srv
  labels:
    app.kubernetes.io/name: ct-test-srv
    app.kubernetes.io/component: test-mock
spec:
  type: ClusterIP
  ports:
    - name: ct-4600
      port: 4600
      targetPort: ct-4600
    - name: ct-4601
      port: 4601
      targetPort: ct-4601
    - name: ct-4602
      port: 4602
      targetPort: ct-4602
    - name: ct-4603
      port: 4603
      targetPort: ct-4603
    - name: ct-4604
      port: 4604
      targetPort: ct-4604
    - name: ct-4605
      port: 4605
      targetPort: ct-4605
    - name: ct-4606
      port: 4606
      targetPort: ct-4606
    - name: ct-4607
      port: 4607
      targetPort: ct-4607
    - name: ct-4608
      port: 4608
      targetPort: ct-4608
    - name: ct-4609
      port: 4609
      targetPort: ct-4609
  selector:
    app.kubernetes.io/name: ct-test-srv
---
