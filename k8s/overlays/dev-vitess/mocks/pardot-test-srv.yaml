# Mock Salesforce/Pardot server for email exporter testing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pardot-test-srv
  labels:
    app.kubernetes.io/name: pardot-test-srv
    app.kubernetes.io/component: test-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pardot-test-srv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pardot-test-srv
        app.kubernetes.io/component: test-mock
    spec:
      containers:
        - name: pardot-test-srv
          image: letsencrypt/boulder:latest
          command:
            - pardot-test-srv
          args:
            - -config
            - /config/pardot-test-srv.json
          ports:
            - name: oauth
              containerPort: 9601
              protocol: TCP
            - name: api
              containerPort: 9602
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pardot-test-srv-config
---
apiVersion: v1
kind: Service
metadata:
  name: pardot-test-srv
  labels:
    app.kubernetes.io/name: pardot-test-srv
    app.kubernetes.io/component: test-mock
spec:
  type: ClusterIP
  ports:
    - name: oauth
      port: 9601
      targetPort: oauth
    - name: api
      port: 9602
      targetPort: api
  selector:
    app.kubernetes.io/name: pardot-test-srv
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pardot-test-srv-config
  labels:
    app.kubernetes.io/name: pardot-test-srv
    app.kubernetes.io/component: test-mock
data:
  pardot-test-srv.json: |
    {
      "SalesforceAddr": ":9601",
      "PardotAddr": ":9602",
      "ExpectedClientID": "test-client-id",
      "ExpectedClientSecret": "test-client-secret"
    }
