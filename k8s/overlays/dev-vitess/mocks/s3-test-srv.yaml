# Mock S3 server for CRL storage (used by crl-storer and crl-checker)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-test-srv
  labels:
    app.kubernetes.io/name: s3-test-srv
    app.kubernetes.io/component: test-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s3-test-srv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-test-srv
        app.kubernetes.io/component: test-mock
    spec:
      containers:
        - name: s3-test-srv
          image: letsencrypt/boulder:latest
          command:
            - s3-test-srv
          args:
            - -listen
            - ":4501"
          ports:
            - name: http
              containerPort: 4501
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: s3-test-srv
  labels:
    app.kubernetes.io/name: s3-test-srv
    app.kubernetes.io/component: test-mock
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4501
      targetPort: http
  selector:
    app.kubernetes.io/name: s3-test-srv
