# Challenge test server - mock DNS and HTTP challenge responder
apiVersion: apps/v1
kind: Deployment
metadata:
  name: challtestsrv
  labels:
    app.kubernetes.io/name: challtestsrv
    app.kubernetes.io/component: test-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: challtestsrv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: challtestsrv
        app.kubernetes.io/component: test-mock
    spec:
      containers:
        - name: challtestsrv
          image: letsencrypt/boulder:latest
          command:
            - challtestsrv
          args:
            - -management
            - ":8055"
            - -http01
            - ":5002"
            - -https01
            - ":5001"
            - -tlsalpn01
            - ":5001"
            - -dns01
            - ":8053"
          ports:
            - name: management
              containerPort: 8055
              protocol: TCP
            - name: http01
              containerPort: 5002
              protocol: TCP
            - name: https01
              containerPort: 5001
              protocol: TCP
            - name: dns
              containerPort: 8053
              protocol: UDP
            - name: dns-tcp
              containerPort: 8053
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: challtestsrv
  labels:
    app.kubernetes.io/name: challtestsrv
    app.kubernetes.io/component: test-mock
spec:
  type: ClusterIP
  ports:
    - name: management
      port: 8055
      targetPort: management
    - name: http01
      port: 5002
      targetPort: http01
    - name: https01
      port: 5001
      targetPort: https01
    - name: dns
      port: 8053
      targetPort: dns
      protocol: UDP
    - name: dns-tcp
      port: 8053
      targetPort: dns-tcp
      protocol: TCP
  selector:
    app.kubernetes.io/name: challtestsrv
