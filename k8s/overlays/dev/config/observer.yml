---
debugaddr: ":8040"
buckets: [.001, .002, .005, .01, .02, .05, .1, .2, .5, 1, 2, 5, 10]
syslog:
  stdoutlevel: 6
monitors:
  - period: 5s
    kind: DNS
    settings:
      protocol: udp
      server: 8.8.8.8:53
      recurse: true
      query_name: google.com
      query_type: A
  - period: 10s
    kind: DNS
    settings:
      protocol: tcp
      server: 8.8.8.8:53
      recurse: true
      query_name: google.com
      query_type: A
  - period: 5s
    kind: DNS
    settings:
      protocol: tcp
      server: 1.1.1.1:53
      recurse: true
      query_name: google.com
      query_type: A
  - period: 10s
    kind: TCP
    settings:
      hostport: boulder-wfe2.boulder.svc.cluster.local:4001
