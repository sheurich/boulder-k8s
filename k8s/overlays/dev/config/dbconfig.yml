# sql-migrate configuration for Boulder K8s dev environment
# https://github.com/rubenv/sql-migrate#readme
#
# Connects directly to MySQL (not through ProxySQL) for initial schema setup.
# Uses TLS with skip-verify since Go MySQL driver can't load custom CAs
# from connection strings.

boulder_sa_test:
  dialect: mysql
  datasource: root@tcp(mysql:3306)/boulder_sa_test?parseTime=true&tls=skip-verify
  dir: boulder_sa

incidents_sa_test:
  dialect: mysql
  datasource: root@tcp(mysql:3306)/incidents_sa_test?parseTime=true&tls=skip-verify
  dir: incidents_sa
