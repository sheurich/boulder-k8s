# sql-migrate configuration for Boulder K8s dev environment
# https://github.com/rubenv/sql-migrate#readme
# Connects through ProxySQL to MySQL (passwordless in dev mode)

boulder_sa_test:
  dialect: mysql
  datasource: root@tcp(proxysql:6033)/boulder_sa_test?parseTime=true
  dir: boulder_sa

incidents_sa_test:
  dialect: mysql
  datasource: root@tcp(proxysql:6033)/incidents_sa_test?parseTime=true
  dir: incidents_sa
