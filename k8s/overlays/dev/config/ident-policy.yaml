#
# Boulder identifier policy for dev/test environments
#

# ExactBlockedNames prevent issuance for the exact names listed, as well as
# their wildcard form.
ExactBlockedNames:
  - "highrisk.example.com"

# HighRiskBlockedNames prevent issuance for the exact names listed as well as
# all subdomains/wildcards.
HighRiskBlockedNames:
  # See RFC 3152
  - "ip6.arpa"
  # See RFC 2317
  - "in-addr.arpa"
  - "example"
  - "example.net"
  - "example.org"
  - "invalid"
  - "local"
  - "localhost"
  - "test"

# AdminBlockedNames are treated the same as HighRiskBlockedNames by Boulder
AdminBlockedNames: []

# AdminBlockedPrefixes is a list of IP address prefixes that are blocked
AdminBlockedPrefixes:
  - "224.0.0.0/4"
  - "ff00::/8"
