# Rate limit overrides for dev environment
# Relax limits for testing
- NewRegistrationsPerIPAddress:
    burst: 1000000
    count: 1000000
    period: 168h
    ids:
      - id: 0.0.0.0/0
        comment: Allow all IPs in dev
- CertificatesPerDomain:
    burst: 10000
    count: 10000
    period: 2160h
    ids:
      - id: example.com
        comment: Test domain
      - id: test.local
        comment: Local test domain
- CertificatesPerFQDNSet:
    burst: 10000
    count: 10000
    period: 168h
    ids:
      - id: example.com
        comment: Test domain
      - id: test.local
        comment: Local test domain
