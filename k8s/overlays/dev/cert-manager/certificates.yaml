# Certificate resources for Boulder service-to-service mTLS
# Replaces the service certificates from generate-internal-pki.sh
---
# WFE2 (Web Frontend) - hostOverride: wfe.boulder
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: boulder-wfe2-grpc-tls
  namespace: boulder
spec:
  secretName: boulder-wfe2-grpc-tls
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  commonName: boulder-wfe2
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - boulder-wfe2
    - boulder-wfe2.boulder.svc.cluster.local
    - wfe.boulder
  issuerRef:
    name: boulder-internal-ca
    kind: Issuer
    group: cert-manager.io
---
