# Patch boulder-wfe2-external to use NodePort for Kind cluster
# Kind extraPortMappings: containerPort 30001/30431 → hostPort 4001/4431
apiVersion: v1
kind: Service
metadata:
  name: boulder-wfe2-external
spec:
  type: NodePort
  ports:
    - name: http
      port: 4001
      targetPort: http
      nodePort: 30001
    - name: https
      port: 4431
      targetPort: https
      nodePort: 30431
