# Patch db-migrate for dev environment
apiVersion: batch/v1
kind: Job
metadata:
  name: boulder-db-migrate
spec:
  template:
    spec:
      containers:
        - name: db-migrate
          # Use boulder-tools (now locally built for ARM64 support)
          image: letsencrypt/boulder-tools:latest
          imagePullPolicy: IfNotPresent
          workingDir: /boulder/sa/db
          command:
            - sh
            - -c
            - |
              set -ex
              # Trap to capture errors and ensure logs are flushed
              trap 'echo "==> ERROR: Command failed with exit code $?"; sleep 10' EXIT

              echo "==> Debug info"
              echo "Working dir: $(pwd)"
              ls -la
              echo "==> Config file:"
              cat /config/dbconfig.yml

              echo "==> Running Boulder SA migrations..."
              sql-migrate up -config=/config/dbconfig.yml -env=boulder_sa_test
              echo "==> Running Incidents SA migrations..."
              sql-migrate up -config=/config/dbconfig.yml -env=incidents_sa_test
              echo "==> Migrations complete"
              trap - EXIT