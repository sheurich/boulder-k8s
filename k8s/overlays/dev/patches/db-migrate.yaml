# Patch db-migrate for dev environment - use golang image with sql-migrate
apiVersion: batch/v1
kind: Job
metadata:
  name: boulder-db-migrate
spec:
  template:
    spec:
      containers:
        - name: db-migrate
          # Use golang alpine image and install sql-migrate
          image: golang:1.23-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: GOBIN
              value: /usr/local/bin
          command:
            - sh
            - -c
            - |
              set -e
              echo "Installing sql-migrate..."
              go install github.com/rubenv/sql-migrate/sql-migrate@latest

              cd /boulder/sa/db

              echo "Running Boulder SA migrations..."
              sql-migrate up -config=/config/dbconfig.yml -env=boulder_sa_test

              echo "Running Incidents SA migrations..."
              sql-migrate up -config=/config/dbconfig.yml -env=incidents_sa_test

              echo "Migrations complete"
