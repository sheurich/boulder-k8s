# Fix boulder command for all deployments
# Boulder uses 'boulder <subcommand>' not 'boulder-<subcommand>'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-wfe2
spec:
  template:
    spec:
      containers:
        - name: boulder-wfe2
          command: ["boulder"]
          args: ["boulder-wfe2", "--config", "/config/wfe2.json"]
---
