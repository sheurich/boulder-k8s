apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-nonce-a
spec:
  template:
    spec:
      containers:
        - name: boulder-nonce
          command: ["boulder"]
          args: ["nonce-service", "--config", "/config/nonce-a.json", "--addr", "$(POD_IP):9101"]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
