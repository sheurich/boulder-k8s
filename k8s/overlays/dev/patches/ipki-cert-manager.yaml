# Patch to map cert-manager secret format to Boulder expected format
# cert-manager: tls.crt, tls.key, ca.crt
# Boulder expects: cert.pem, key.pem for services; ca.crt for CA
---
# WFE2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-wfe2
spec:
  template:
    spec:
      volumes:
        - name: ipki-ca
          secret:
            secretName: boulder-internal-ca
            items:
              - key: tls.crt
                path: ca.crt
        - name: ipki-service
          secret:
            secretName: boulder-wfe2-grpc-tls
            items:
              - key: tls.crt
                path: cert.pem
              - key: tls.key
                path: key.pem
        - name: web-tls
          secret:
            secretName: boulder-wfe2-web-tls
            items:
              - key: tls.crt
                path: cert.pem
              - key: tls.key
                path: key.pem
