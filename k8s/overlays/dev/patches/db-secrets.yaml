# Patch to mount secrets for services that need database/redis access
# Maps boulder-db-urls and boulder-redis-password secrets to services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-ra
spec:
  template:
    spec:
      volumes:
        - name: secrets
          secret:
            secretName: boulder-redis-password
            items:
              - key: redis_password
                path: redis_password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-sa
spec:
  template:
    spec:
      volumes:
        - name: secrets
          secret:
            secretName: boulder-db-urls
            items:
              - key: sa_dburl
                path: sa_dburl
              - key: sa_ro_dburl
                path: sa_ro_dburl
              - key: incidents_dburl
                path: incidents_dburl
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boulder-bad-key-revoker
spec:
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: secrets
              secret:
                secretName: boulder-db-urls
                items:
                  - key: badkeyrevoker_dburl
                    path: badkeyrevoker_dburl
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: boulder-cert-checker
spec:
  jobTemplate:
    spec:
      template:
        spec:
          volumes:
            - name: secrets
              secret:
                secretName: boulder-db-urls
                items:
                  - key: cert_checker_dburl
                    path: cert_checker_dburl
