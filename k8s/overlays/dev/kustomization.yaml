apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boulder

# Database architecture: MySQL 8 + ProxySQL
# Use dev-vitess overlay for Vitess alternative
components:
  - ../../components/db-proxysql

resources:
  - ../../base
  # Redis secrets
  - secrets/redis-password.yaml
  # Test mocks
  - mocks/challtestsrv.yaml
  - mocks/ct-test-srv.yaml
  - mocks/pardot-test-srv.yaml
  # PKI ceremony job
  - ceremony/pki-ceremony.yaml

# Patch for dev-specific settings
patches:
  # Use SoftHSM for CA
  - path: patches/ca-softhsm.yaml
  # Mount DB URL secrets
  - path: patches/db-secrets.yaml
  # Reduce replicas for dev
  - path: patches/replicas.yaml
  # Reduce resource limits for dev
  - path: patches/resources.yaml
  # Relax network policies for dev
  - path: patches/network-policies.yaml
  # Set imagePullPolicy: Never for local images
  - path: patches/image-pull-policy.yaml
  # Fix boulder command/args for local images
  - path: patches/boulder-commands.yaml
  # Mount WebPKI certificates for services that need issuer certs
  - path: patches/webpki-certs.yaml
  # Use golang image for db-migrate (boulder-tools has no arm64 build)
  - path: patches/db-migrate.yaml
  # Mount nonce HMAC key secrets in nonce services
  - path: patches/nonce-secrets.yaml
  # Relax probe timeouts for dev (kind is slower)
  - path: patches/probes.yaml

configMapGenerator:
  # Boulder configs for dev environment
  - name: boulder-wfe2-config
    files:
      - config/wfe2.json
      - config/ratelimit-defaults.yml
      - config/ratelimit-overrides.yml
  - name: boulder-ra-config
    files:
      - config/ra.json
      - config/ratelimit-defaults.yml
      - config/ratelimit-overrides.yml
      - config/ident-policy.yaml
      - config/ct-log-list.json
  - name: boulder-sa-config
    files:
      - config/sa.json
  - name: boulder-ca-config
    files:
      - config/ca.json
      - config/ident-policy.yaml
      - config/zlint.toml
      - config/ct-log-list.json
  - name: boulder-va-config
    files:
      - config/va.json
  - name: boulder-rva1-config
    files:
      - config/remoteva-a.json
  - name: boulder-rva2-config
    files:
      - config/remoteva-b.json
  - name: boulder-rva3-config
    files:
      - config/remoteva-c.json
  - name: boulder-publisher-config
    files:
      - config/publisher.json
  - name: boulder-nonce-a-config
    files:
      - config/nonce-a.json
  - name: boulder-nonce-b-config
    files:
      - config/nonce-b.json
  - name: boulder-crl-updater-config
    files:
      - config/crl-updater.json
  - name: boulder-crl-storer-config
    files:
      - config/crl-storer.json
  - name: boulder-observer-config
    files:
      - config/observer.yml
  - name: boulder-email-exporter-config
    files:
      - config/email-exporter.json
  - name: boulder-sfe-config
    files:
      - config/sfe.json
  - name: boulder-bad-key-revoker-config
    files:
      - config/bad-key-revoker.json
  - name: boulder-log-validator-config
    files:
      - config/log-validator.json
  - name: boulder-cert-checker-config
    files:
      - config/cert-checker.json
  - name: boulder-crl-checker-config
    files:
      - config/crl-checker.json
  # Database migration config
  - name: boulder-db-migrate-config
    files:
      - dbconfig.yml=config/dbconfig.yml
  # SoftHSM configuration
  - name: boulder-softhsm-config
    files:
      - softhsm2.conf=config/softhsm2.conf
  # Shared config files used by multiple services
  - name: boulder-shared-config
    files:
      - config/ratelimit-defaults.yml
      - config/ratelimit-overrides.yml
      - config/ident-policy.yaml
      - config/zlint.toml
      - config/ct-log-list.json
      - config/crl-storer.ini

images:
  - name: letsencrypt/boulder
    newName: boulder
    newTag: latest

commonLabels:
  environment: dev
