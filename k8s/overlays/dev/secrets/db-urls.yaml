# Database connection URL secrets for Boulder services
# Format: user@tcp(host:port)/database?params
# Connects through ProxySQL (port 6033) to MySQL
apiVersion: v1
kind: Secret
metadata:
  name: boulder-db-urls
  labels:
    app.kubernetes.io/name: boulder
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # SA primary database connection
  sa_dburl: "sa@tcp(proxysql:6033)/boulder_sa_test?readTimeout=14s&writeTimeout=14s&timeout=1s"
  # SA read-only connection
  sa_ro_dburl: "sa_ro@tcp(proxysql:6033)/boulder_sa_test?readTimeout=14s&writeTimeout=14s&timeout=1s"
  # Incidents database connection
  incidents_dburl: "incidents_sa@tcp(proxysql:6033)/incidents_sa_test?readTimeout=14s&timeout=1s"
  # Cert checker connection (read-only)
  cert_checker_dburl: "cert_checker@tcp(proxysql:6033)/boulder_sa_test?readTimeout=14s&timeout=1s"
  # Bad key revoker connection
  badkeyrevoker_dburl: "badkeyrevoker@tcp(proxysql:6033)/boulder_sa_test?readTimeout=14s&timeout=1s"
  # Revoker connection
  revoker_dburl: "revoker@tcp(proxysql:6033)/boulder_sa_test?readTimeout=14s&timeout=1s"
