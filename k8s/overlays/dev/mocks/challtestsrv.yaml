# Challenge test server - mock DNS and HTTP challenge responder
# HTTP-01 binds to port 80 (required by ACME spec) with NET_BIND_SERVICE capability
apiVersion: apps/v1
kind: Deployment
metadata:
  name: challtestsrv
  labels:
    app.kubernetes.io/name: challtestsrv
    app.kubernetes.io/component: test-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: challtestsrv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: challtestsrv
        app.kubernetes.io/component: test-mock
        environment: dev
    spec:
      containers:
        - name: challtestsrv
          image: boulder:latest
          imagePullPolicy: Never
          command:
            - chall-test-srv
          args:
            - -management
            - ":8055"
            - -http01
            - ":80"
            - -https01
            - ":443"
            - -tlsalpn01
            - ":443"
            - -dns01
            - ":8053"
            - -doh
            - ":8443"
            - -doh-cert
            - /certs/ipki/challtestsrv/cert.pem
            - -doh-cert-key
            - /certs/ipki/challtestsrv/key.pem
            - -defaultIPv6
            - ""
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
          ports:
            - name: management
              containerPort: 8055
              protocol: TCP
            - name: http01
              containerPort: 80
              protocol: TCP
            - name: https01
              containerPort: 443
              protocol: TCP
            - name: dns
              containerPort: 8053
              protocol: UDP
            - name: dns-tcp
              containerPort: 8053
              protocol: TCP
            - name: doh
              containerPort: 8443
              protocol: TCP
          volumeMounts:
            - name: ipki-service
              mountPath: /certs/ipki/challtestsrv
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: ipki-service
          secret:
            secretName: boulder-challtestsrv-grpc-tls
---
apiVersion: v1
kind: Service
metadata:
  name: challtestsrv
  labels:
    app.kubernetes.io/name: challtestsrv
    app.kubernetes.io/component: test-mock
spec:
  type: ClusterIP
  clusterIP: 10.96.99.195
  ports:
    - name: management
      port: 8055
      targetPort: management
    - name: http01
      port: 80
      targetPort: http01
    - name: https01
      port: 443
      targetPort: https01
    - name: dns
      port: 8053
      targetPort: dns
      protocol: UDP
    - name: dns-tcp
      port: 8053
      targetPort: dns-tcp
      protocol: TCP
    - name: doh
      port: 8443
      targetPort: doh
      protocol: TCP
  selector:
    app.kubernetes.io/name: challtestsrv
