# Vitess vtcomboserver deployment for Boulder dev/CI
# Uses letsencrypt/boulder-vtcomboserver image
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vitess-data
  labels:
    app.kubernetes.io/name: vitess
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitess
  labels:
    app.kubernetes.io/name: vitess
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: boulder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vitess
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vitess
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: boulder
    spec:
      containers:
        - name: vtcombo
          image: letsencrypt/boulder-vtcomboserver:latest
          imagePullPolicy: Never
          env:
            # Create keyspaces for Boulder databases
            - name: KEYSPACES
              value: boulder_sa_test,incidents_sa_test
            - name: NUM_SHARDS
              value: "1,1"
            # MySQL database name for install_trigger.sh
            - name: MYSQL_DATABASE
              value: boulder_sa_test
          ports:
            # VTGate MySQL protocol port (default 33577)
            - name: mysql
              containerPort: 33577
            - name: vtgate-grpc
              containerPort: 15999
            - name: vtadmin
              containerPort: 14200
          volumeMounts:
            - name: data
              mountPath: /vt/vtdataroot
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vitess-data
---
apiVersion: v1
kind: Service
metadata:
  name: vitess
  labels:
    app.kubernetes.io/name: vitess
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: boulder
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
    - port: 15999
      targetPort: vtgate-grpc
      protocol: TCP
      name: vtgate-grpc
    - port: 14200
      targetPort: vtadmin
      protocol: TCP
      name: vtadmin
  selector:
    app.kubernetes.io/name: vitess
