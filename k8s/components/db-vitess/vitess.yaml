# Vitess vtcomboserver deployment for Boulder dev/CI
# Uses letsencrypt/boulder-vtcomboserver image
apiVersion: v1
kind: ConfigMap
metadata:
  name: vitess-config
  labels:
    app.kubernetes.io/name: vitess
    app.kubernetes.io/component: database
data:
  # Aggressive MySQL settings to speed up initialization
  # vtcombo has hardcoded 30s timeout - we need MySQL to start FAST
  fast-startup.cnf: |
    [mysqld]
    # Disable doublewrite buffer (unsafe for prod, fine for testing)
    innodb_doublewrite=OFF
    # Minimize buffer pool
    innodb_buffer_pool_size=64M
    # Skip buffer pool state save/load
    innodb_buffer_pool_load_at_startup=OFF
    innodb_buffer_pool_dump_at_shutdown=OFF
    # Smaller redo logs = faster init
    innodb_redo_log_capacity=32M
    # Fast commits (unsafe for prod)
    innodb_flush_log_at_trx_commit=0
    sync_binlog=0
    # Skip DNS lookups
    skip-name-resolve
    # Reduce temp table size
    tmp_table_size=16M
    max_heap_table_size=16M
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitess
  labels:
    app.kubernetes.io/name: vitess
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: boulder
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vitess
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vitess
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: boulder
    spec:
      containers:
        - name: vtcombo
          image: letsencrypt/boulder-vtcomboserver:latest
          imagePullPolicy: Never
          env:
            # Create keyspaces for Boulder databases
            - name: KEYSPACES
              value: boulder_sa_test,incidents_sa_test
            - name: NUM_SHARDS
              value: "1,1"
            # MySQL database name for install_trigger.sh
            - name: MYSQL_DATABASE
              value: boulder_sa_test
            # Inject fast MySQL config to speed up initialization
            # vtcombo has hardcoded 30s timeout for MySQL startup
            - name: EXTRA_MY_CNF
              value: /vt/config/fast-startup.cnf
          ports:
            # VTGate MySQL protocol port (default 33577)
            - name: mysql
              containerPort: 33577
            - name: vtgate-grpc
              containerPort: 15999
            - name: vtadmin
              containerPort: 14200
          volumeMounts:
            - name: data
              mountPath: /vt/vtdataroot
            - name: config
              mountPath: /vt/config
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          # Give MySQL time to start - CI runners can be slow
          # Total tolerance must exceed init-timeout (5m) + buffer
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 360
            periodSeconds: 30
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 180
            periodSeconds: 10
            failureThreshold: 36
      volumes:
        - name: data
          # Use tmpfs for fastest I/O in CI - vtcombo has hardcoded 30s timeout
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: config
          configMap:
            name: vitess-config
---
apiVersion: v1
kind: Service
metadata:
  name: vitess
  labels:
    app.kubernetes.io/name: vitess
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: boulder
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
    - port: 15999
      targetPort: vtgate-grpc
      protocol: TCP
      name: vtgate-grpc
    - port: 14200
      targetPort: vtadmin
      protocol: TCP
      name: vtadmin
  selector:
    app.kubernetes.io/name: vitess
