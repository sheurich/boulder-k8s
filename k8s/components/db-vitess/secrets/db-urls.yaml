# Database connection URL secrets for Boulder services
# Format: user@tcp(host:port)/database?params
# Note: Vitess vtcomboserver uses SKIP_USERS=1 - authentication handled differently
apiVersion: v1
kind: Secret
metadata:
  name: boulder-db-urls
  labels:
    app.kubernetes.io/name: boulder
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # SA primary database connection
  sa_dburl: "sa@tcp(vitess:3306)/boulder_sa_test?readTimeout=14s&writeTimeout=14s&timeout=5s&tls=skip-verify"
  # SA read-only connection
  sa_ro_dburl: "sa_ro@tcp(vitess:3306)/boulder_sa_test?readTimeout=14s&writeTimeout=14s&timeout=5s&tls=skip-verify"
  # Incidents database connection
  incidents_dburl: "incidents_sa@tcp(vitess:3306)/incidents_sa_test?readTimeout=14s&timeout=5s&tls=skip-verify"
  # Cert checker connection (read-only)
  cert_checker_dburl: "cert_checker@tcp(vitess:3306)/boulder_sa_test?readTimeout=14s&timeout=5s&tls=skip-verify"
  # Bad key revoker connection
  badkeyrevoker_dburl: "badkeyrevoker@tcp(vitess:3306)/boulder_sa_test?readTimeout=14s&timeout=5s&tls=skip-verify"
  # Revoker connection
  revoker_dburl: "revoker@tcp(vitess:3306)/boulder_sa_test?readTimeout=14s&timeout=5s&tls=skip-verify"
