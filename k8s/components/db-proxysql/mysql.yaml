# MySQL 8.4 deployment for Boulder dev/CI
# Uses official mysql:8.4 image with init scripts for Boulder databases
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
data:
  init-boulder.sql: |
    -- Boulder database initialization for dev/CI
    -- Creates databases and users required by Boulder services

    -- Create databases
    CREATE DATABASE IF NOT EXISTS boulder_sa_test;
    CREATE DATABASE IF NOT EXISTS incidents_sa_test;

    -- SA user - primary read/write access to boulder_sa_test
    CREATE USER IF NOT EXISTS 'sa'@'%' IDENTIFIED WITH mysql_native_password BY '';
    GRANT ALL PRIVILEGES ON boulder_sa_test.* TO 'sa'@'%';

    -- SA read-only user
    CREATE USER IF NOT EXISTS 'sa_ro'@'%' IDENTIFIED WITH mysql_native_password BY '';
    GRANT SELECT ON boulder_sa_test.* TO 'sa_ro'@'%';

    -- Incidents SA user - access to incidents_sa_test, read-only to boulder_sa_test
    CREATE USER IF NOT EXISTS 'incidents_sa'@'%' IDENTIFIED WITH mysql_native_password BY '';
    GRANT ALL PRIVILEGES ON incidents_sa_test.* TO 'incidents_sa'@'%';
    GRANT SELECT ON boulder_sa_test.* TO 'incidents_sa'@'%';

    -- Cert checker user (read-only)
    CREATE USER IF NOT EXISTS 'cert_checker'@'%' IDENTIFIED WITH mysql_native_password BY '';
    GRANT SELECT ON boulder_sa_test.* TO 'cert_checker'@'%';

    -- Bad key revoker user
    CREATE USER IF NOT EXISTS 'badkeyrevoker'@'%' IDENTIFIED WITH mysql_native_password BY '';
    GRANT SELECT, UPDATE ON boulder_sa_test.* TO 'badkeyrevoker'@'%';

    -- Revoker user
    CREATE USER IF NOT EXISTS 'revoker'@'%' IDENTIFIED WITH mysql_native_password BY '';
    GRANT SELECT, UPDATE ON boulder_sa_test.* TO 'revoker'@'%';

    -- ProxySQL monitor user
    CREATE USER IF NOT EXISTS 'proxysql'@'%' IDENTIFIED WITH mysql_native_password BY '';
    GRANT USAGE ON *.* TO 'proxysql'@'%';

    FLUSH PRIVILEGES;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: boulder
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - mysqld
            - --bind-address=0.0.0.0
            - --slow-query-log=ON
            - --long-query-time=2
            - --mysql-native-password=ON
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "yes"
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: init-scripts
          configMap:
            name: mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    app.kubernetes.io/name: mysql
