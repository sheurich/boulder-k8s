# MySQL 8.4 deployment for Boulder dev/CI
# Uses official mysql:8.4 image with init scripts for Boulder databases
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
data:
  init-boulder.sql: |
    -- Boulder database initialization for dev/CI
    -- Creates databases and users required by Boulder services
    -- All users REQUIRE X509 for mTLS from ProxySQL

    -- Create databases
    CREATE DATABASE IF NOT EXISTS boulder_sa_test;
    CREATE DATABASE IF NOT EXISTS incidents_sa_test;

    -- SA user - primary read/write access to boulder_sa_test
    CREATE USER IF NOT EXISTS 'sa'@'%' IDENTIFIED WITH mysql_native_password BY '' REQUIRE X509;
    GRANT ALL PRIVILEGES ON boulder_sa_test.* TO 'sa'@'%';

    -- SA read-only user
    CREATE USER IF NOT EXISTS 'sa_ro'@'%' IDENTIFIED WITH mysql_native_password BY '' REQUIRE X509;
    GRANT SELECT ON boulder_sa_test.* TO 'sa_ro'@'%';

    -- Incidents SA user - access to incidents_sa_test, read-only to boulder_sa_test
    CREATE USER IF NOT EXISTS 'incidents_sa'@'%' IDENTIFIED WITH mysql_native_password BY '' REQUIRE X509;
    GRANT ALL PRIVILEGES ON incidents_sa_test.* TO 'incidents_sa'@'%';
    GRANT SELECT ON boulder_sa_test.* TO 'incidents_sa'@'%';

    -- Cert checker user (read-only)
    CREATE USER IF NOT EXISTS 'cert_checker'@'%' IDENTIFIED WITH mysql_native_password BY '' REQUIRE X509;
    GRANT SELECT ON boulder_sa_test.* TO 'cert_checker'@'%';

    -- Bad key revoker user
    CREATE USER IF NOT EXISTS 'badkeyrevoker'@'%' IDENTIFIED WITH mysql_native_password BY '' REQUIRE X509;
    GRANT SELECT, UPDATE ON boulder_sa_test.* TO 'badkeyrevoker'@'%';

    -- Revoker user
    CREATE USER IF NOT EXISTS 'revoker'@'%' IDENTIFIED WITH mysql_native_password BY '' REQUIRE X509;
    GRANT SELECT, UPDATE ON boulder_sa_test.* TO 'revoker'@'%';

    -- ProxySQL monitor user
    CREATE USER IF NOT EXISTS 'proxysql'@'%' IDENTIFIED WITH mysql_native_password BY '' REQUIRE X509;
    GRANT USAGE ON *.* TO 'proxysql'@'%';

    FLUSH PRIVILEGES;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: boulder
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - mysqld
            - --bind-address=0.0.0.0
            - --slow-query-log=ON
            - --long-query-time=2
            - --mysql-native-password=ON
            # TLS settings - require secure transport for all connections
            - --ssl-cert=/certs/tls.crt
            - --ssl-key=/certs/tls.key
            - --ssl-ca=/certs/ca.crt
            - --require_secure_transport=ON
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "yes"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
            - name: tls-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Liveness: basic connectivity (localhost OK)
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 30
            failureThreshold: 12
          # Readiness: TLS-verified via pod IP (localhost bypasses require_secure_transport)
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysql -h "$POD_IP" --ssl-mode=REQUIRED -e "SELECT 1"
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 30
            failureThreshold: 40
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: init-scripts
          configMap:
            name: mysql-init
        - name: tls-certs
          projected:
            sources:
              - secret:
                  name: mysql-tls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - secret:
                  name: boulder-internal-ca
                  items:
                    # CA cert is in tls.crt for self-signed CA certificates
                    - key: tls.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    app.kubernetes.io/name: mysql
