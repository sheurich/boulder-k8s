# ProxySQL deployment for Boulder dev/CI
# Proxies connections from Boulder services to MySQL
# Based on upstream boulder/test/proxysql/proxysql.cnf
#
# NOTE: ProxySQL's DNS resolver has issues with K8s DNS.
# We use an init container to resolve MySQL's IP and generate the config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxysql-config-template
  labels:
    app.kubernetes.io/name: proxysql
    app.kubernetes.io/component: database
data:
  proxysql.cnf.template: |
    datadir = "/var/lib/proxysql";

    admin_variables = {
      mysql_ifaces = "0.0.0.0:6032";
      admin_credentials = "admin:admin;radmin:radmin";
      web_enabled = "true";
      web_port = 6080;
      stats_credentials = "stats:stats";
    };

    mysql_variables = {
      threads = 4;
      max_connections = 2048;
      have_compress = True;
      poll_timeout = 2000;
      interfaces = "0.0.0.0:6033";
      stacksize = 1048576;
      max_allowed_packet = 16777216;
      # Allow up to 20 seconds to find a server
      connect_timeout_server = 20000;
      connect_timeout_server_max = 20000;
      monitor_username = "proxysql";
      monitor_password = "";
      monitor_history = 600000;
      monitor_connect_interval = 60000;
      monitor_ping_interval = 10000;
      monitor_read_only_interval = 1000;
      monitor_read_only_timeout = 500;
      monitor_writer_is_also_reader = False;
      commands_stats = True;
      sessions_sort = True;
      connect_retries_on_failure = 10;
      free_connections_pct = 90;
      connection_warming = True;
      # Frontend TLS (client connections to ProxySQL)
      have_ssl = True;
      ssl_p2c_cert = "/certs/tls.crt";
      ssl_p2c_key = "/certs/tls.key";
      ssl_p2c_ca = "/certs/ca.crt";
      # Backend TLS (ProxySQL connections to MySQL)
      ssl_p2s_cert = "/certs/tls.crt";
      ssl_p2s_key = "/certs/tls.key";
      ssl_p2s_ca = "/certs/ca.crt";
    };

    mysql_servers = (
      {
        # IP resolved by init container - ProxySQL has glibc DNS issues with K8s
        address = "MYSQL_IP_PLACEHOLDER";
        port = 3306;
        hostgroup = 0;
        max_connections = 100;
        max_latency_ms = 200;
        use_ssl = 1;
      }
    );

    mysql_users = (
      { username = "root"; },
      { username = "sa"; },
      { username = "sa_ro"; },
      { username = "incidents_sa"; },
      { username = "cert_checker"; },
      { username = "badkeyrevoker"; },
      { username = "revoker"; }
    );

    mysql_query_rules = (
      {
        rule_id = 1;
        active = 1;
        match_digest = ".";
        log = 0;
        apply = 0;
      },
      {
        rule_id = 10;
        username = "sa";
        timeout = 4900;
      },
      {
        rule_id = 11;
        username = "sa_ro";
        timeout = 4900;
      },
      {
        rule_id = 16;
        username = "badkeyrevoker";
        timeout = 3600000;
      }
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxysql
  labels:
    app.kubernetes.io/name: proxysql
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: boulder
    spec:
      initContainers:
        # Resolve MySQL IP and generate config
        # ProxySQL's glibc DNS has timing issues with K8s DNS
        - name: resolve-mysql
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              set -e
              echo "Waiting for MySQL DNS to resolve..."
              until nslookup mysql.boulder.svc.cluster.local >/dev/null 2>&1; do
                echo "  DNS not ready, retrying..."
                sleep 2
              done

              echo "Waiting for MySQL to accept connections..."
              until nc -z mysql.boulder.svc.cluster.local 3306; do
                sleep 2
              done

              # Resolve MySQL IP
              MYSQL_IP=$(getent hosts mysql.boulder.svc.cluster.local | awk '{print $1}')
              echo "MySQL resolved to: $MYSQL_IP"

              # Generate config with resolved IP
              sed "s/MYSQL_IP_PLACEHOLDER/$MYSQL_IP/" /config-template/proxysql.cnf.template > /config/proxysql.cnf
              echo "Generated ProxySQL config with MySQL IP: $MYSQL_IP"
              cat /config/proxysql.cnf | grep -A5 "mysql_servers"
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config
              mountPath: /config
      containers:
        - name: proxysql
          image: proxysql/proxysql:2.7.2
          args:
            - proxysql
            - -f
            - --idle-threads
            - -c
            - /etc/proxysql/proxysql.cnf
            - --initial
          ports:
            - name: mysql
              containerPort: 6033
            - name: admin
              containerPort: 6032
            - name: web
              containerPort: 6080
          volumeMounts:
            - name: config
              mountPath: /etc/proxysql
            - name: tls-certs
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config-template
          configMap:
            name: proxysql-config-template
        - name: config
          emptyDir: {}
        - name: tls-certs
          projected:
            sources:
              - secret:
                  name: proxysql-tls
                  items:
                    - key: tls.crt
                      path: tls.crt
                    - key: tls.key
                      path: tls.key
              - secret:
                  name: boulder-internal-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: proxysql
  labels:
    app.kubernetes.io/name: proxysql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 6033
      targetPort: mysql
      protocol: TCP
      name: mysql
    - port: 6032
      targetPort: admin
      protocol: TCP
      name: admin
    - port: 6080
      targetPort: web
      protocol: TCP
      name: web
  selector:
    app.kubernetes.io/name: proxysql
