# ProxySQL deployment for Boulder dev/CI
# Proxies connections from Boulder services to MySQL
# Based on upstream boulder/test/proxysql/proxysql.cnf
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxysql-config
  labels:
    app.kubernetes.io/name: proxysql
    app.kubernetes.io/component: database
data:
  proxysql.cnf: |
    datadir = "/var/lib/proxysql";

    admin_variables = {
      mysql_ifaces = "0.0.0.0:6032";
      admin_credentials = "admin:admin;radmin:radmin";
      web_enabled = "true";
      web_port = 6080;
      stats_credentials = "stats:stats";
    };

    mysql_variables = {
      threads = 4;
      max_connections = 2048;
      have_compress = True;
      poll_timeout = 2000;
      interfaces = "0.0.0.0:6033";
      stacksize = 1048576;
      max_allowed_packet = 16777216;
      # Allow up to 20 seconds to find a server
      connect_timeout_server = 20000;
      connect_timeout_server_max = 20000;
      monitor_username = "proxysql";
      monitor_password = "";
      monitor_history = 600000;
      monitor_connect_interval = 60000;
      monitor_ping_interval = 10000;
      monitor_read_only_interval = 1000;
      monitor_read_only_timeout = 500;
      monitor_writer_is_also_reader = False;
      commands_stats = True;
      sessions_sort = True;
      connect_retries_on_failure = 10;
      free_connections_pct = 90;
      connection_warming = True;
    };

    mysql_servers = (
      {
        # Using headless service DNS resolves directly to pod IP
        # In dev environment, the service ClusterIP works reliably
        address = "10.96.188.65";
        port = 3306;
        hostgroup = 0;
        max_connections = 100;
        max_latency_ms = 200;
      }
    );

    mysql_users = (
      { username = "root"; },
      { username = "sa"; },
      { username = "sa_ro"; },
      { username = "incidents_sa"; },
      { username = "cert_checker"; },
      { username = "badkeyrevoker"; },
      { username = "revoker"; }
    );

    mysql_query_rules = (
      {
        rule_id = 1;
        active = 1;
        match_digest = ".";
        log = 0;
        apply = 0;
      },
      {
        rule_id = 10;
        username = "sa";
        timeout = 4900;
      },
      {
        rule_id = 11;
        username = "sa_ro";
        timeout = 4900;
      },
      {
        rule_id = 16;
        username = "badkeyrevoker";
        timeout = 3600000;
      }
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxysql
  labels:
    app.kubernetes.io/name: proxysql
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proxysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proxysql
        app.kubernetes.io/component: database
    spec:
      initContainers:
        # Wait for MySQL to be ready
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL..."
              until nc -z mysql.boulder.svc.cluster.local 3306; do
                sleep 2
              done
              echo "MySQL is ready"
      containers:
        - name: proxysql
          image: proxysql/proxysql:2.7.2
          args:
            - proxysql
            - -f
            - --idle-threads
            - -c
            - /etc/proxysql/proxysql.cnf
            - --initial
          ports:
            - name: mysql
              containerPort: 6033
            - name: admin
              containerPort: 6032
            - name: web
              containerPort: 6080
          volumeMounts:
            - name: config
              mountPath: /etc/proxysql
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: proxysql-config
---
apiVersion: v1
kind: Service
metadata:
  name: proxysql
  labels:
    app.kubernetes.io/name: proxysql
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 6033
      targetPort: mysql
      protocol: TCP
      name: mysql
    - port: 6032
      targetPort: admin
      protocol: TCP
      name: admin
    - port: 6080
      targetPort: web
      protocol: TCP
      name: web
  selector:
    app.kubernetes.io/name: proxysql
