apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -f docker-compose.next.yml --out k8s/
    kompose.version: 1.36.0 (HEAD)
  labels:
    io.kompose.service: bjaeger
  name: bjaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: bjaeger
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -f docker-compose.next.yml --out k8s/
        kompose.version: 1.36.0 (HEAD)
      labels:
        io.kompose.service: bjaeger
    spec:
      containers:
        - image: jaegertracing/all-in-one:1.50
          name: bjaeger
      restartPolicy: Always
