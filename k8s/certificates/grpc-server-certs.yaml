---
# Boulder WFE2 gRPC Server Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: boulder-wfe2-grpc-cert
  namespace: boulder
  labels:
    app.kubernetes.io/name: boulder-wfe2
    app.kubernetes.io/component: grpc-tls
spec:
  secretName: boulder-wfe2-grpc-tls
  duration: 2160h # 90 days
  renewBefore: 720h # 30 days
  subject:
    organizations:
      - Boulder ACME Services
  commonName: boulder-wfe2.boulder.svc.cluster.local
  dnsNames:
    - boulder-wfe2
    - boulder-wfe2.boulder
    - boulder-wfe2.boulder.svc
    - boulder-wfe2.boulder.svc.cluster.local
    - localhost
  ipAddresses:
    - "127.0.0.1"
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  issuerRef:
    name: boulder-ca-issuer
    kind: Issuer
    group: cert-manager.io
