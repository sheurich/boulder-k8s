---
# Self-signed ClusterIssuer for Boulder internal mTLS certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-cluster-issuer
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/component: cluster-issuer
spec:
  selfSigned: {}
---
# Internal CA Certificate for Boulder services
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: boulder-internal-ca
  namespace: cert-manager
  labels:
    app.kubernetes.io/name: boulder-ca
    app.kubernetes.io/component: internal-ca
spec:
  isCA: true
  commonName: Boulder Internal CA
  duration: 43800h # 5 years
  renewBefore: 8760h # 1 year
  subject:
    organizationalUnits:
      - Boulder Internal PKI
    organizations:
      - Boulder ACME Services
    countries:
      - US
  secretName: boulder-internal-ca-secret
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: selfsigned-cluster-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# CA Issuer using the internal CA certificate
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: boulder-ca-issuer
  labels:
    app.kubernetes.io/name: boulder-ca
    app.kubernetes.io/component: ca-issuer
spec:
  ca:
    secretName: boulder-internal-ca-secret
---
# Namespace-specific issuer for boulder namespace
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: boulder-ca-issuer
  namespace: boulder
  labels:
    app.kubernetes.io/name: boulder-ca
    app.kubernetes.io/component: ca-issuer
spec:
  ca:
    secretName: boulder-internal-ca-secret
