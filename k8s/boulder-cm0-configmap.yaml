    #!/usr/bin/env bash
    #
    # Outer wrapper for invoking test.sh inside docker-compose.
    #

    set -o errexit

    if type realpath >/dev/null 2>&1 ; then
      cd "$(realpath -- $(dirname -- "$0"))"
