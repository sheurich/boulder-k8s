---
# Boulder Remote Validation Authority 2 (Remote VA2) Deployment
# Provides distributed domain validation for geographic diversity
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-remote-va2
  namespace: boulder
  labels:
    app: boulder-remote-va2
    app.kubernetes.io/name: boulder-remote-va2
    app.kubernetes.io/component: remote-validation-authority
    app.kubernetes.io/part-of: boulder
  annotations:
    boulder.letsencrypt.org/ocsp-excluded: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boulder-remote-va2
  template:
    metadata:
      labels:
        app: boulder-remote-va2
        app.kubernetes.io/name: boulder-remote-va2
        app.kubernetes.io/component: remote-validation-authority
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for dependencies..."
              until nslookup boulder-sa.boulder.svc.cluster.local; do
                echo "Waiting for SA service..."
                sleep 2
              done
              echo "All dependencies ready!"
      containers:
        - name: boulder-remote-va2
          image: boulder:latest
          command: ["boulder", "boulder-va"]
          args: ["--config", "/etc/boulder/remote-va2.json"]
          ports:
            - containerPort: 9497
              name: grpc
              protocol: TCP
            - containerPort: 8005
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
            # mTLS Environment Variables
            - name: BOULDER_GRPC_TLS_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_TLS_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_TLS_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: BOULDER_GRPC_CLIENT_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_CLIENT_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_CLIENT_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_GO_LOG_SEVERITY_LEVEL
              value: "info"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
            # mTLS Certificate Mounts
            - name: server-tls
              mountPath: /etc/boulder/tls/server
              readOnly: true
            - name: ca-tls
              mountPath: /etc/boulder/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8005
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: boulder-remote-va2-config
        - name: internal-certs
          secret:
            secretName: internal-pki
        # mTLS Certificate Volumes
        - name: server-tls
          secret:
            secretName: remote-va2-grpc-tls
            defaultMode: 0400  # Read-only for owner only
        - name: ca-tls
          secret:
            secretName: intermediate-ca-secret
            defaultMode: 0444  # Read-only for all
---
# Boulder Remote VA2 ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: boulder-remote-va2-config
  namespace: boulder
  labels:
    app: boulder-remote-va2
    app.kubernetes.io/name: boulder-remote-va2
    app.kubernetes.io/component: remote-validation-authority-config
data:
  remote-va2.json: |
    {
      "remoteVA": {
        "debugAddr": ":8005",
        "grpc": {
          "address": ":9497",
          "maxConnectionAge": "30s",
          "services": {
            "va.VA": {
              "clientNames": [
                "va.boulder"
              ]
            },
            "va.CAA": {
              "clientNames": [
                "va.boulder"
              ]
            },
            "grpc.health.v1.Health": {
              "clientNames": [
                "health-checker.boulder"
              ]
            }
          }
        },
        "saService": {
          "serverAddress": "boulder-sa:9395",
          "hostOverride": "sa.boulder",
          "timeout": "15s",
          "clientCertificate": "/etc/boulder/tls/server/tls.crt",
          "clientKey": "/etc/boulder/tls/server/tls.key",
          "serverCertificate": "/etc/boulder/tls/ca/tls.crt"
        },
        "dnsProvider": {
          "server": "8.8.8.8:53",
          "timeout": "10s"
        },
        "maxChallengeAttempts": 3,
        "challengeLifetime": "300s"
      },
      "syslog": {
        "stdoutLevel": 6,
        "syslogLevel": 6
      }
    }
