---
# Boulder Publisher Deployment
# Submits certificates to CT logs and retrieves SCTs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-publisher
  namespace: boulder
  labels:
    app: boulder-publisher
    app.kubernetes.io/name: boulder-publisher
    app.kubernetes.io/component: ct-publisher
    app.kubernetes.io/part-of: boulder
  annotations:
    boulder.io/ocsp-excluded: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boulder-publisher
  template:
    metadata:
      labels:
        app: boulder-publisher
        app.kubernetes.io/name: boulder-publisher
        app.kubernetes.io/component: ct-publisher
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: boulder-publisher
          image: boulder-k8s:latest
          imagePullPolicy: IfNotPresent
          command: ["boulder", "boulder-publisher"]
          args: ["--config", "/etc/boulder/publisher.json"]
          ports:
            - containerPort: 9391
              name: grpc
              protocol: TCP
            - containerPort: 8009
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
            # mTLS Environment Variables
            - name: BOULDER_GRPC_TLS_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_TLS_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_TLS_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: BOULDER_GRPC_CLIENT_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_CLIENT_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_CLIENT_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_GO_LOG_SEVERITY_LEVEL
              value: "info"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
            # mTLS Certificate Mounts
            - name: server-tls
              mountPath: /etc/boulder/tls/server
              readOnly: true
            - name: ca-tls
              mountPath: /etc/boulder/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8009
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8009
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: boulder-publisher-config
        - name: internal-certs
          secret:
            secretName: internal-pki
        # mTLS Certificate Volumes
        - name: server-tls
          secret:
            secretName: boulder-publisher-grpc-tls
            defaultMode: 0400  # Read-only for owner only
        - name: ca-tls
          secret:
            secretName: intermediate-ca-secret
            defaultMode: 0444  # Read-only for all
---
# Boulder Publisher Service
apiVersion: v1
kind: Service
metadata:
  name: boulder-publisher
  namespace: boulder
  labels:
    app: boulder-publisher
    app.kubernetes.io/name: boulder-publisher
    app.kubernetes.io/component: ct-publisher
    app.kubernetes.io/part-of: boulder
spec:
  type: ClusterIP
  ports:
    - port: 9391
      targetPort: 9391
      protocol: TCP
      name: grpc
  selector:
    app: boulder-publisher
---
# Boulder Publisher ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: boulder-publisher-config
  namespace: boulder
  labels:
    app: boulder-publisher
    app.kubernetes.io/name: boulder-publisher
    app.kubernetes.io/component: ct-publisher-config
data:
  publisher.json: |
    {
      "publisher": {
        "debugAddr": ":8009",
        "grpc": {
          "address": ":9391",
          "maxConnectionAge": "30s",
          "services": {
            "Publisher": {
              "clientNames": [
                "ra.boulder"
              ]
            },
            "grpc.health.v1.Health": {
              "clientNames": [
                "health-checker.boulder"
              ]
            }
          }
        },

        "tls": {
          "caCertFile": "/etc/boulder/tls/ca/tls.crt",
          "certFile": "/etc/boulder/tls/server/tls.crt",
          "keyFile": "/etc/boulder/tls/server/tls.key"
        },

        "userAgent": "boulder/1.0",
        "blockProfileRate": 1000000000,
        "chains": [
          [
            "/etc/boulder/webpki/int-ecdsa-a.cert.pem",
            "/etc/boulder/webpki/root-ecdsa.cert.pem"
          ],
          [
            "/etc/boulder/webpki/int-ecdsa-b.cert.pem",
            "/etc/boulder/webpki/root-ecdsa.cert.pem"
          ]
        ],

        "features": {}
      },
      "syslog": {
        "stdoutLevel": 6,
        "syslogLevel": 6
      }
    }
