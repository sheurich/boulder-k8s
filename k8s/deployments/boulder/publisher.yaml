---
# Boulder Publisher Deployment
# Submits certificates to CT logs and retrieves SCTs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-publisher
  namespace: boulder
  labels:
    app: boulder-publisher
    app.kubernetes.io/name: boulder-publisher
    app.kubernetes.io/component: ct-publisher
    app.kubernetes.io/part-of: boulder
  annotations:
    boulder.io/ocsp-excluded: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boulder-publisher
  template:
    metadata:
      labels:
        app: boulder-publisher
        app.kubernetes.io/name: boulder-publisher
        app.kubernetes.io/component: ct-publisher
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: boulder-publisher
          image: boulder:latest
          command: ["boulder", "boulder-publisher"]
          args: ["--config", "/etc/boulder/publisher.json"]
          ports:
            - containerPort: 9391
              name: grpc
              protocol: TCP
            - containerPort: 8009
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8009
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8009
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: boulder-publisher-config
        - name: internal-certs
          secret:
            secretName: internal-pki
---
# Boulder Publisher Service
apiVersion: v1
kind: Service
metadata:
  name: boulder-publisher
  namespace: boulder
  labels:
    app: boulder-publisher
    app.kubernetes.io/name: boulder-publisher
    app.kubernetes.io/component: ct-publisher
    app.kubernetes.io/part-of: boulder
spec:
  type: ClusterIP
  ports:
    - port: 9391
      targetPort: 9391
      protocol: TCP
      name: grpc
  selector:
    app: boulder-publisher
---
# Boulder Publisher ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: boulder-publisher-config
  namespace: boulder
  labels:
    app: boulder-publisher
    app.kubernetes.io/name: boulder-publisher
    app.kubernetes.io/component: ct-publisher-config
data:
  publisher.json: |
    {
      "publisher": {
        "grpcAddress": ":9391",
        "debugAddr": ":8009",
        "ctLogs": [
          {
            "uri": "http://ct-test-srv:4600",
            "key": "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEYggOxPnPkzKBIhTacSYoIfnSL2jPugcbUKx83vFMvk5gKAz/AGe87w20riuPwEGn229hKVbEKHFB61NIqNHC3Q=="
          }
        ],
        "maxReqsPerLog": 1000,
        "submissionTimeout": "30s",
        "logListFile": "/etc/boulder/ct-logs.json"
      },
      "syslog": {
        "stdoutLevel": 6,
        "syslogLevel": 6
      },
      "common": {
        "dnsResolver": "8.8.8.8:53",
        "dnsTimeout": "10s",
        "dnsAllowLoopbackAddresses": true,
        "tls": {
          "certFile": "/etc/boulder/certs/publisher.boulder/cert.pem",
          "keyFile": "/etc/boulder/certs/publisher.boulder/key.pem",
          "caCertFile": "/etc/boulder/certs/minica.pem"
        }
      }
    }
