---
# Boulder SCT (Signed Certificate Timestamp) Provider Deployment
# Manages Certificate Transparency log submissions and responses
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-sct-provider
  namespace: boulder
  labels:
    app: boulder-sct-provider
    app.kubernetes.io/name: boulder-sct-provider
    app.kubernetes.io/component: sct-provider
    app.kubernetes.io/part-of: boulder
  annotations:
    boulder.letsencrypt.org/ocsp-excluded: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boulder-sct-provider
  template:
    metadata:
      labels:
        app: boulder-sct-provider
        app.kubernetes.io/name: boulder-sct-provider
        app.kubernetes.io/component: sct-provider
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for dependencies..."
              until nslookup boulder-sa.boulder.svc.cluster.local; do
                echo "Waiting for SA service..."
                sleep 2
              done
              echo "All dependencies ready!"
      containers:
        - name: boulder-sct-provider
          image: boulder-k8s:latest
          imagePullPolicy: Never
          command: ["boulder", "boulder-sct-provider"]
          args: ["--config", "/etc/boulder/sct-provider.json"]
          ports:
            - containerPort: 9999
              name: grpc
              protocol: TCP
            - containerPort: 8006
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
            # mTLS Environment Variables
            - name: BOULDER_GRPC_TLS_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_TLS_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_TLS_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: BOULDER_GRPC_CLIENT_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_CLIENT_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_CLIENT_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_GO_LOG_SEVERITY_LEVEL
              value: "info"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
            # mTLS Certificate Mounts
            - name: server-tls
              mountPath: /etc/boulder/tls/server
              readOnly: true
            - name: ca-tls
              mountPath: /etc/boulder/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8006
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: boulder-sct-provider-config
        - name: internal-certs
          secret:
            secretName: internal-pki
        # mTLS Certificate Volumes
        - name: server-tls
          secret:
            secretName: sct-provider-grpc-tls
            defaultMode: 0400  # Read-only for owner only
        - name: ca-tls
          secret:
            secretName: intermediate-ca-secret
            defaultMode: 0444  # Read-only for all
---
# Boulder SCT Provider ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: boulder-sct-provider-config
  namespace: boulder
  labels:
    app: boulder-sct-provider
    app.kubernetes.io/name: boulder-sct-provider
    app.kubernetes.io/component: sct-provider-config
data:
  sct-provider.json: |
    {
      "sctProvider": {
        "debugAddr": ":8006",
        "grpc": {
          "address": ":9999",
          "maxConnectionAge": "30s",
          "services": {
            "sctProvider.SCTProvider": {
              "clientNames": [
                "ca.boulder"
              ]
            },
            "grpc.health.v1.Health": {
              "clientNames": [
                "health-checker.boulder"
              ]
            }
          }
        },
        "saService": {
          "serverAddress": "boulder-sa:9395",
          "hostOverride": "sa.boulder",
          "timeout": "15s",
          "noWaitForReady": true
        },
        "tls": {
          "caCertFile": "/etc/boulder/tls/ca/tls.crt",
          "certFile": "/etc/boulder/tls/server/tls.crt",
          "keyFile": "/etc/boulder/tls/server/tls.key"
        },
        "ctLogs": [
          {
            "uri": "https://ct.googleapis.com/logs/argon2024/",
            "key": "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEHblsqctplMVc5ramA7vSuNxUQxcomQwGAVAdnWTAWUYr3MgDHQW0LagJ95WilzzlWsamDBIcm8FCO0lBS8KpPw=="
          }
        ],
        "logListFile": "/etc/boulder/ct-test-srv/log_list.json"
      },
      "syslog": {
        "stdoutlevel": 6,
        "sysloglevel": 6
      }
    }
