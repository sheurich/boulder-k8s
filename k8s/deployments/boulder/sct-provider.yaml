---
# Boulder SCT (Signed Certificate Timestamp) Provider Deployment
# Manages Certificate Transparency log submissions and responses
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-sct-provider
  namespace: boulder
  labels:
    app: boulder-sct-provider
    app.kubernetes.io/name: boulder-sct-provider
    app.kubernetes.io/component: sct-provider
    app.kubernetes.io/part-of: boulder
  annotations:
    boulder.letsencrypt.org/ocsp-excluded: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boulder-sct-provider
  template:
    metadata:
      labels:
        app: boulder-sct-provider
        app.kubernetes.io/name: boulder-sct-provider
        app.kubernetes.io/component: sct-provider
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for dependencies..."
              until nslookup boulder-sa.boulder.svc.cluster.local; do
                echo "Waiting for SA service..."
                sleep 2
              done
              echo "All dependencies ready!"
      containers:
        - name: boulder-sct-provider
          image: boulder:latest
          command: ["boulder", "boulder-sct-provider"]
          args: ["--config", "/etc/boulder/sct-provider.json"]
          ports:
            - containerPort: 9999
              name: grpc
              protocol: TCP
            - containerPort: 8006
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8006
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: boulder-sct-provider-config
        - name: internal-certs
          secret:
            secretName: internal-pki
---
# Boulder SCT Provider ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: boulder-sct-provider-config
  namespace: boulder
  labels:
    app: boulder-sct-provider
    app.kubernetes.io/name: boulder-sct-provider
    app.kubernetes.io/component: sct-provider-config
data:
  sct-provider.json: |
    {
      "sctProvider": {
        "grpcAddress": ":9999",
        "debugAddr": ":8006",
        "saService": {
          "serverAddress": "boulder-sa:9395",
          "hostOverride": "sa.boulder",
          "timeout": "15s"
        },
        "ctLogs": [
          {
            "uri": "https://ct.googleapis.com/logs/argon2024/",
            "key": "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEHblsqctplMVc5ramA7vSuNxUQxcomQwGAVAdnWTAWUYr3MgDHQW0LagJ95WilzzlWsamDBIcm8FCO0lBS8KpPw=="
          }
        ],
        "logListFile": "/etc/boulder/ct-test-srv/log_list.json"
      },
      "syslog": {
        "stdoutLevel": 6,
        "syslogLevel": 6
      },
      "common": {
        "dnsResolver": "8.8.8.8:53",
        "dnsTimeout": "10s",
        "dnsAllowLoopbackAddresses": true,
        "tls": {
          "certFile": "/etc/boulder/certs/sct-provider.boulder/cert.pem",
          "keyFile": "/etc/boulder/certs/sct-provider.boulder/key.pem",
          "caCertFile": "/etc/boulder/certs/minica.pem"
        }
      }
    }
