---
# Boulder Storage Authority (SA) Deployment
# Database abstraction layer for all Boulder services
# Manages certificate, account, and order storage operations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-sa
  namespace: boulder
  labels:
    app: boulder-sa
    app.kubernetes.io/name: boulder-sa
    app.kubernetes.io/component: storage-authority
    app.kubernetes.io/part-of: boulder
  annotations:
    # Explicitly note OCSP exclusion
    boulder.io/ocsp-excluded: "true"
spec:
  replicas: 2  # 2 replicas for high availability
  selector:
    matchLabels:
      app: boulder-sa
  template:
    metadata:
      labels:
        app: boulder-sa
        app.kubernetes.io/name: boulder-sa
        app.kubernetes.io/component: storage-authority
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-database
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for database dependencies..."
              until nslookup mariadb.boulder.svc.cluster.local; do
                echo "Waiting for MariaDB service..."
                sleep 2
              done
              echo "Database dependencies ready!"
      containers:
        - name: boulder-sa
          image: boulder:latest
          imagePullPolicy: IfNotPresent
          command: ["boulder", "boulder-sa"]
          args: ["--config", "/etc/boulder/sa.json"]
          ports:
            - containerPort: 9395
              name: grpc
              protocol: TCP
            - containerPort: 8003
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
            # mTLS Environment Variables
            - name: BOULDER_GRPC_TLS_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_TLS_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_TLS_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: BOULDER_GRPC_CLIENT_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_CLIENT_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_CLIENT_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_GO_LOG_SEVERITY_LEVEL
              value: "info"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
            - name: db-credentials
              mountPath: /etc/boulder/secrets
              readOnly: true
            # mTLS Certificate Mounts
            - name: server-tls
              mountPath: /etc/boulder/tls/server
              readOnly: true
            - name: ca-tls
              mountPath: /etc/boulder/tls/ca
              readOnly: true
            # Database Client Certificate Mounts
            - name: db-client-tls
              mountPath: /etc/boulder/tls/db-client
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: boulder-sa-config
        - name: internal-certs
          secret:
            secretName: internal-pki
        - name: db-credentials
          secret:
            secretName: db-credentials
        # mTLS Certificate Volumes
        - name: server-tls
          secret:
            secretName: boulder-sa-grpc-tls
            defaultMode: 0400  # Read-only for owner only
        - name: ca-tls
          secret:
            secretName: intermediate-ca-secret
            defaultMode: 0444  # Read-only for all
        # Database Client Certificate Volume
        - name: db-client-tls
          secret:
            secretName: mariadb-client-tls
            defaultMode: 0400  # Read-only for owner only
---
# Boulder SA Service
apiVersion: v1
kind: Service
metadata:
  name: boulder-sa
  namespace: boulder
  labels:
    app: boulder-sa
    app.kubernetes.io/name: boulder-sa
    app.kubernetes.io/component: storage-authority
    app.kubernetes.io/part-of: boulder
spec:
  type: ClusterIP
  ports:
    - port: 9395
      targetPort: 9395
      protocol: TCP
      name: grpc
  selector:
    app: boulder-sa
---
# Boulder SA ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: boulder-sa-config
  namespace: boulder
  labels:
    app: boulder-sa
    app.kubernetes.io/name: boulder-sa
    app.kubernetes.io/component: storage-authority-config
data:
  sa.json: |
    {
      "sa": {
        "debugAddr": ":8003",
        "grpc": {
          "address": ":9395",
          "maxConnectionAge": "30s",
          "services": {
            "sa.StorageAuthority": {
              "clientNames": [
                "ca.boulder",
                "ra.boulder"
              ]
            },
            "sa.StorageAuthorityReadOnly": {
              "clientNames": [
                "wfe.boulder",
                "sfe.boulder"
              ]
            },
            "grpc.health.v1.Health": {
              "clientNames": [
                "health-checker.boulder"
              ]
            }
          }
        },

        "db": {
          "dbConnectFile": "/etc/boulder/secrets/sa_dburl",
          "maxOpenConns": 100,
          "maxIdleConns": 10,
          "connMaxLifetime": "3600s"
        },
        "readOnlyDB": {
          "dbConnectFile": "/etc/boulder/secrets/sa_ro_dburl",
          "maxOpenConns": 100
        },
        "incidentsDB": {
          "dbConnectFile": "/etc/boulder/secrets/incidents_dburl",
          "maxOpenConns": 100
        },

        "tls": {
          "caCertFile": "/etc/boulder/tls/ca/tls.crt",
          "certFile": "/etc/boulder/tls/server/tls.crt",
          "keyFile": "/etc/boulder/tls/server/tls.key"
        },

        "features": {
          "ServeRenewalInfo": true,
          "CheckCertificateBySerial": true
        }
      },

      "syslog": {
        "stdoutLevel": 6,
        "syslogLevel": 6
      }
    }
