---
# Boulder Validation Authority (VA) Deployment
# Performs domain validation challenges (HTTP-01, DNS-01, TLS-ALPN-01)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-va
  namespace: boulder
  labels:
    app: boulder-va
    app.kubernetes.io/name: boulder-va
    app.kubernetes.io/component: validation-authority
    app.kubernetes.io/part-of: boulder
  annotations:
    boulder.io/ocsp-excluded: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boulder-va
  template:
    metadata:
      labels:
        app: boulder-va
        app.kubernetes.io/name: boulder-va
        app.kubernetes.io/component: validation-authority
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for dependencies..."
              until nslookup boulder-sa.boulder.svc.cluster.local; do
                echo "Waiting for SA service..."
                sleep 2
              done
              until nslookup remoteva-a.boulder.svc.cluster.local; do
                echo "Waiting for Remote VA services..."
                sleep 2
              done
              echo "All dependencies ready!"
      containers:
        - name: boulder-va
          image: boulder:latest
          command: ["boulder", "boulder-va"]
          args: ["--config", "/etc/boulder/va.json"]
          ports:
            - containerPort: 9392
              name: grpc
              protocol: TCP
            - containerPort: 8004
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: boulder-va-config
        - name: internal-certs
          secret:
            secretName: internal-pki
---
# Boulder VA Service
apiVersion: v1
kind: Service
metadata:
  name: boulder-va
  namespace: boulder
  labels:
    app: boulder-va
    app.kubernetes.io/name: boulder-va
    app.kubernetes.io/component: validation-authority
    app.kubernetes.io/part-of: boulder
spec:
  type: ClusterIP
  ports:
    - port: 9392
      targetPort: 9392
      protocol: TCP
      name: grpc
  selector:
    app: boulder-va
---
# Boulder VA ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: boulder-va-config
  namespace: boulder
  labels:
    app: boulder-va
    app.kubernetes.io/name: boulder-va
    app.kubernetes.io/component: validation-authority-config
data:
  va.json: |
    {
      "va": {
        "grpcAddress": ":9392",
        "debugAddr": ":8004",
        "saService": {
          "serverAddress": "boulder-sa:9395",
          "hostOverride": "sa.boulder",
          "timeout": "15s"
        },
        "remoteVAs": [
          {
            "serverAddress": "remoteva-a:9397",
            "timeout": "15s",
            "hostOverride": "rva1.boulder"
          },
          {
            "serverAddress": "remoteva-b:9498",
            "timeout": "15s",
            "hostOverride": "rva2.boulder"
          },
          {
            "serverAddress": "remoteva-c:9499",
            "timeout": "15s",
            "hostOverride": "rva3.boulder"
          }
        ],
        "dnsProvider": {
          "server": "8.8.8.8:53",
          "timeout": "10s"
        },
        "maxChallengeAttempts": 3,
        "challengeLifetime": "300s"
      },
      "syslog": {
        "stdoutLevel": 6,
        "syslogLevel": 6
      },
      "common": {
        "dnsResolver": "8.8.8.8:53",
        "dnsTimeout": "10s",
        "dnsAllowLoopbackAddresses": true,
        "tls": {
          "certFile": "/etc/boulder/certs/va.boulder/cert.pem",
          "keyFile": "/etc/boulder/certs/va.boulder/key.pem",
          "caCertFile": "/etc/boulder/certs/minica.pem"
        }
      }
    }
