---
# Boulder Validation Authority (VA) Deployment
# Performs domain validation challenges (HTTP-01, DNS-01, TLS-ALPN-01)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-va
  namespace: boulder
  labels:
    app: boulder-va
    app.kubernetes.io/name: boulder-va
    app.kubernetes.io/component: validation-authority
    app.kubernetes.io/part-of: boulder
  annotations:
    boulder.io/ocsp-excluded: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boulder-va
  template:
    metadata:
      labels:
        app: boulder-va
        app.kubernetes.io/name: boulder-va
        app.kubernetes.io/component: validation-authority
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for dependencies..."
              until nslookup boulder-sa.boulder.svc.cluster.local; do
                echo "Waiting for SA service..."
                sleep 2
              done
              until nslookup remoteva-a.boulder.svc.cluster.local; do
                echo "Waiting for Remote VA services..."
                sleep 2
              done
              echo "All dependencies ready!"
      containers:
        - name: boulder-va
          image: boulder:latest
          imagePullPolicy: IfNotPresent
          command: ["boulder", "boulder-va"]
          args: ["--config", "/etc/boulder/va.json"]
          ports:
            - containerPort: 9392
              name: grpc
              protocol: TCP
            - containerPort: 8004
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
            # mTLS Environment Variables
            - name: BOULDER_GRPC_TLS_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_TLS_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_TLS_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: BOULDER_GRPC_CLIENT_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_CLIENT_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_CLIENT_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_GO_LOG_SEVERITY_LEVEL
              value: "info"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
            # mTLS Certificate Mounts
            - name: server-tls
              mountPath: /etc/boulder/tls/server
              readOnly: true
            - name: ca-tls
              mountPath: /etc/boulder/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: boulder-va-config
        - name: internal-certs
          secret:
            secretName: internal-pki
        # mTLS Certificate Volumes
        - name: server-tls
          secret:
            secretName: boulder-va-grpc-tls
            defaultMode: 0400  # Read-only for owner only
        - name: ca-tls
          secret:
            secretName: intermediate-ca-secret
            defaultMode: 0444  # Read-only for all
---
# Boulder VA Service
apiVersion: v1
kind: Service
metadata:
  name: boulder-va
  namespace: boulder
  labels:
    app: boulder-va
    app.kubernetes.io/name: boulder-va
    app.kubernetes.io/component: validation-authority
    app.kubernetes.io/part-of: boulder
spec:
  type: ClusterIP
  ports:
    - port: 9392
      targetPort: 9392
      protocol: TCP
      name: grpc
  selector:
    app: boulder-va
---
# Boulder VA ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: boulder-va-config
  namespace: boulder
  labels:
    app: boulder-va
    app.kubernetes.io/name: boulder-va
    app.kubernetes.io/component: validation-authority-config
data:
  va.json: |
    {
      "va": {
        "debugAddr": ":8004",
        "grpc": {
          "address": ":9392",
          "maxConnectionAge": "30s",
          "services": {
            "va.VA": {
              "clientNames": [
                "ra.boulder"
              ]
            },
            "va.CAA": {
              "clientNames": [
                "ra.boulder"
              ]
            },
            "grpc.health.v1.Health": {
              "clientNames": [
                "health-checker.boulder"
              ]
            }
          }
        },

        "saService": {
          "serverAddress": "boulder-sa:9395",
          "hostOverride": "sa.boulder",
          "timeout": "15s",
          "clientCertificate": "/etc/boulder/tls/server/tls.crt",
          "clientKey": "/etc/boulder/tls/server/tls.key",
          "serverCertificate": "/etc/boulder/tls/ca/tls.crt"
        },

        "tls": {
          "caCertFile": "/etc/boulder/tls/ca/tls.crt",
          "certFile": "/etc/boulder/tls/server/tls.crt",
          "keyFile": "/etc/boulder/tls/server/tls.key"
        },

        "remoteVAs": [
          {
            "serverAddress": "remoteva-a:9397",
            "timeout": "15s",
            "hostOverride": "rva1.boulder",
            "perspective": "dadaist",
            "rir": "ARIN"
          },
          {
            "serverAddress": "remoteva-b:9498",
            "timeout": "15s",
            "hostOverride": "rva2.boulder",
            "perspective": "surrealist",
            "rir": "RIPE"
          },
          {
            "serverAddress": "remoteva-c:9499",
            "timeout": "15s",
            "hostOverride": "rva3.boulder",
            "perspective": "cubist",
            "rir": "ARIN"
          }
        ],

        "dnsProvider": {
          "server": "8.8.8.8:53",
          "timeout": "10s"
        },

        "userAgent": "boulder",
        "issuerDomain": "boulder.service.consul",
        "maxChallengeAttempts": 3,
        "challengeLifetime": "300s",
        "dnsTries": 3,
        "dnsTimeout": "10s",

        "accountURIPrefixes": [
          "http://boulder-wfe2:4001/acme/acct/"
        ],

        "features": {}
      },
      "syslog": {
        "stdoutLevel": 6,
        "syslogLevel": 6
      },
      "common": {
        "dnsResolver": "8.8.8.8:53",
        "dnsTimeout": "10s",
        "dnsAllowLoopbackAddresses": true,
        "tls": {
          "certFile": "/etc/boulder/tls/server/tls.crt",
          "keyFile": "/etc/boulder/tls/server/tls.key",
          "caCertFile": "/etc/boulder/tls/ca/tls.crt"
        }
      }
    }
