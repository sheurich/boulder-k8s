---
# Boulder Registration Authority (RA) Deployment
# Orchestrates certificate issuance workflow and manages account operations
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-ra
  namespace: boulder
  labels:
    app: boulder-ra
    app.kubernetes.io/name: boulder-ra
    app.kubernetes.io/component: registration-authority
    app.kubernetes.io/part-of: boulder
  annotations:
    # Explicitly note OCSP exclusion
    boulder.io/ocsp-excluded: "true"
spec:
  replicas: 2  # 2 replicas for high availability
  selector:
    matchLabels:
      app: boulder-ra
  template:
    metadata:
      labels:
        app: boulder-ra
        app.kubernetes.io/name: boulder-ra
        app.kubernetes.io/component: registration-authority
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for dependencies..."
              until nslookup boulder-sa.boulder.svc.cluster.local; do
                echo "Waiting for SA service..."
                sleep 2
              done
              until nslookup boulder-ca.boulder.svc.cluster.local; do
                echo "Waiting for CA service..."
                sleep 2
              done
              until nslookup boulder-va.boulder.svc.cluster.local; do
                echo "Waiting for VA service..."
                sleep 2
              done
              until nslookup boulder-publisher.boulder.svc.cluster.local; do
                echo "Waiting for Publisher service..."
                sleep 2
              done
              echo "All dependencies ready!"
      containers:
        - name: boulder-ra
          image: boulder:latest
          imagePullPolicy: IfNotPresent
          command: ["boulder", "boulder-ra"]
          args: ["--config", "/etc/boulder/ra.json"]
          ports:
            - containerPort: 9394
              name: grpc
              protocol: TCP
            - containerPort: 8002
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: redis-password
            # mTLS Environment Variables
            - name: BOULDER_GRPC_TLS_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_TLS_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_TLS_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: BOULDER_GRPC_CLIENT_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_CLIENT_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_CLIENT_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_GO_LOG_SEVERITY_LEVEL
              value: "info"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
            # mTLS Certificate Mounts
            - name: server-tls
              mountPath: /etc/boulder/tls/server
              readOnly: true
            - name: ca-tls
              mountPath: /etc/boulder/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8002
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: boulder-ra-config
        - name: internal-certs
          secret:
            secretName: internal-pki
        # mTLS Certificate Volumes
        - name: server-tls
          secret:
            secretName: boulder-ra-grpc-tls
            defaultMode: 0400  # Read-only for owner only
        - name: ca-tls
          secret:
            secretName: intermediate-ca-secret
            defaultMode: 0444  # Read-only for all
---
# Boulder RA Service
apiVersion: v1
kind: Service
metadata:
  name: boulder-ra
  namespace: boulder
  labels:
    app: boulder-ra
    app.kubernetes.io/name: boulder-ra
    app.kubernetes.io/component: registration-authority
    app.kubernetes.io/part-of: boulder
spec:
  type: ClusterIP
  ports:
    - port: 9394
      targetPort: 9394
      protocol: TCP
      name: grpc
  selector:
    app: boulder-ra
---
# Boulder RA ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: boulder-ra-config
  namespace: boulder
  labels:
    app: boulder-ra
    app.kubernetes.io/name: boulder-ra
    app.kubernetes.io/component: registration-authority-config
data:
  ra.json: |
    {
      "ra": {
        "debugAddr": ":8002",
        "grpc": {
          "address": ":9394",
          "maxConnectionAge": "30s",
          "services": {
            "ra.RegistrationAuthority": {
              "clientNames": [
                "wfe.boulder",
                "sfe.boulder"
              ]
            },
            "grpc.health.v1.Health": {
              "clientNames": [
                "health-checker.boulder"
              ]
            }
          }
        },

        "vaService": {
          "serverAddress": "boulder-va:9392",
          "hostOverride": "va.boulder",
          "timeout": "20s",
          "clientCertificate": "/etc/boulder/tls/server/tls.crt",
          "clientKey": "/etc/boulder/tls/server/tls.key",
          "serverCertificate": "/etc/boulder/tls/ca/tls.crt"
        },

        "caService": {
          "serverAddress": "boulder-ca:9393",
          "hostOverride": "ca.boulder",
          "timeout": "15s",
          "clientCertificate": "/etc/boulder/tls/server/tls.crt",
          "clientKey": "/etc/boulder/tls/server/tls.key",
          "serverCertificate": "/etc/boulder/tls/ca/tls.crt"
        },

        "saService": {
          "serverAddress": "boulder-sa:9395",
          "hostOverride": "sa.boulder",
          "timeout": "15s",
          "clientCertificate": "/etc/boulder/tls/server/tls.crt",
          "clientKey": "/etc/boulder/tls/server/tls.key",
          "serverCertificate": "/etc/boulder/tls/ca/tls.crt"
        },

        "publisherService": {
          "serverAddress": "boulder-publisher:9391",
          "hostOverride": "publisher.boulder",
          "timeout": "300s",
          "clientCertificate": "/etc/boulder/tls/server/tls.crt",
          "clientKey": "/etc/boulder/tls/server/tls.key",
          "serverCertificate": "/etc/boulder/tls/ca/tls.crt"
        },

        "tls": {
          "caCertFile": "/etc/boulder/tls/ca/tls.crt",
          "certFile": "/etc/boulder/tls/server/tls.crt",
          "keyFile": "/etc/boulder/tls/server/tls.key"
        },

        "limiter": {
          "redis": {
            "server": "redis-client:6379",
            "password": "${REDIS_PASSWORD}",
            "maxRetries": 3,
            "timeout": "5s"
          },
          "defaults": {
            "certificatesPerName": {
              "threshold": 5,
              "window": "168h"
            },
            "registrationsPerIP": {
              "threshold": 10,
              "window": "3h"
            },
            "duplicateCertificateLimit": {
              "threshold": 5,
              "window": "168h"
            },
            "pendingAuthorizationsPerAccount": {
              "threshold": 300,
              "window": "168h"
            },
            "certificatesPerFQDNSet": {
              "threshold": 10000,
              "window": "168h"
            }
          }
        },

        "maxNames": 100,
        "doNotForceCN": true,
        "reuseValidAuthz": true,
        "authzCacheTTL": "300s",
        "pendingAuthzCacheTTL": "300s",
        "orderLifetime": "168h",
        "finalizeTimeout": "30s",

        "caaDistributedResolver": {
          "maxResolvers": 3,
          "servers": [
            "8.8.8.8:53",
            "1.1.1.1:53"
          ],
          "timeout": "5s"
        },

        "ctLogs": [
          {
            "uri": "http://ct-test-srv:4600",
            "key": "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEYggOxPnPkzKBIhTacSYoIfnSL2jPugcbUKx83vFMvk5gKAz/AGe87w20riuPwEGn229hKVbEKHFB61NIqNHC3Q=="
          }
        ],

        "features": {}
      },

      "pa": {
        "challenges": {
          "http-01": true,
          "dns-01": true,
          "tls-alpn-01": true
        }
      },

      "syslog": {
        "stdoutLevel": 6,
        "syslogLevel": 6
      },

      "common": {
        "dnsResolver": "8.8.8.8:53",
        "dnsTimeout": "10s",
        "dnsAllowLoopbackAddresses": true,
        "tls": {
          "certFile": "/etc/boulder/certs/ra.boulder/cert.pem",
          "keyFile": "/etc/boulder/certs/ra.boulder/key.pem",
          "caCertFile": "/etc/boulder/certs/minica.pem"
        }
      }
    }
