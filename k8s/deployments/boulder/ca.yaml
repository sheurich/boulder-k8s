---
# Boulder Certificate Authority (CA) Deployment
# Signs certificates, generates CRLs, manages private keys
# NOTE: OCSP generation is EXCLUDED (deprecated functionality)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boulder-ca
  namespace: boulder
  labels:
    app: boulder-ca
    app.kubernetes.io/name: boulder-ca
    app.kubernetes.io/component: certificate-authority
    app.kubernetes.io/part-of: boulder
  annotations:
    # Explicitly note OCSP exclusion
    boulder.io/ocsp-excluded: "true"
spec:
  replicas: 2  # 2 replicas for high availability
  selector:
    matchLabels:
      app: boulder-ca
  template:
    metadata:
      labels:
        app: boulder-ca
        app.kubernetes.io/name: boulder-ca
        app.kubernetes.io/component: certificate-authority
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for dependencies..."
              until nslookup boulder-sa.boulder.svc.cluster.local; do
                echo "Waiting for SA service..."
                sleep 2
              done
              until nslookup boulder-ra-sct-provider.boulder.svc.cluster.local;
              do
                echo "Waiting for SCT Provider service..."
                sleep 2
              done
              echo "All dependencies ready!"
      containers:
        - name: boulder-ca
          image: boulder:latest
          imagePullPolicy: IfNotPresent
          command: ["boulder", "boulder-ca"]
          args: ["--config", "/etc/boulder/ca.json"]
          ports:
            - containerPort: 9393
              name: grpc
              protocol: TCP
            - containerPort: 8001
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
            # mTLS Environment Variables
            - name: BOULDER_GRPC_TLS_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_TLS_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_TLS_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: BOULDER_GRPC_CLIENT_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_CLIENT_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_CLIENT_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_GO_LOG_SEVERITY_LEVEL
              value: "info"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
            - name: webpki-certs
              mountPath: /etc/boulder/webpki
              readOnly: true
            # mTLS Certificate Mounts
            - name: server-tls
              mountPath: /etc/boulder/tls/server
              readOnly: true
            - name: ca-tls
              mountPath: /etc/boulder/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: boulder-ca-config
        - name: internal-certs
          secret:
            secretName: internal-pki
        - name: webpki-certs
          secret:
            secretName: webpki-certs
        # mTLS Certificate Volumes
        - name: server-tls
          secret:
            secretName: boulder-ca-grpc-tls
            defaultMode: 0400  # Read-only for owner only
        - name: ca-tls
          secret:
            secretName: intermediate-ca-secret
            defaultMode: 0444  # Read-only for all
---
# Boulder CA Service
apiVersion: v1
kind: Service
metadata:
  name: boulder-ca
  namespace: boulder
  labels:
    app: boulder-ca
    app.kubernetes.io/name: boulder-ca
    app.kubernetes.io/component: certificate-authority
    app.kubernetes.io/part-of: boulder
spec:
  type: ClusterIP
  ports:
    - port: 9393
      targetPort: 9393
      protocol: TCP
      name: grpc
  selector:
    app: boulder-ca
---
# Boulder CA ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: boulder-ca-config
  namespace: boulder
  labels:
    app: boulder-ca
    app.kubernetes.io/name: boulder-ca
    app.kubernetes.io/component: certificate-authority-config
data:
  ca.json: |
    {
      "ca": {
        "debugAddr": ":8001",
        "grpcCA": {
          "address": ":9393",
          "maxConnectionAge": "30s",
          "services": {
            "ca.CertificateAuthority": {
              "clientNames": [
                "ra.boulder"
              ]
            },
            "ca.CRLGenerator": {
              "clientNames": [
                "crl-updater.boulder"
              ]
            },
            "grpc.health.v1.Health": {
              "clientNames": [
                "health-checker.boulder"
              ]
            }
          }
        },

        "saService": {
          "serverAddress": "boulder-sa:9395",
          "hostOverride": "sa.boulder",
          "timeout": "15s",
          "clientCertificate": "/etc/boulder/tls/server/tls.crt",
          "clientKey": "/etc/boulder/tls/server/tls.key",
          "serverCertificate": "/etc/boulder/tls/ca/tls.crt"
        },
        "sctService": {
          "serverAddress": "boulder-ra-sct-provider:9594",
          "hostOverride": "ra.boulder",
          "timeout": "15s",
          "clientCertificate": "/etc/boulder/tls/server/tls.crt",
          "clientKey": "/etc/boulder/tls/server/tls.key",
          "serverCertificate": "/etc/boulder/tls/ca/tls.crt"
        },

        "tls": {
          "caCertFile": "/etc/boulder/tls/ca/tls.crt",
          "certFile": "/etc/boulder/tls/server/tls.crt",
          "keyFile": "/etc/boulder/tls/server/tls.key"
        },

        "issuance": {
          "certProfiles": {
            "legacy": {
              "allowMustStaple": false,
              "omitCommonName": false,
              "omitKeyEncipherment": false,
              "omitClientAuth": false,
              "omitSKID": false,
              "omitOCSP": true,
              "includeCRLDistributionPoints": true,
              "maxValidityPeriod": "7776000s",
              "maxValidityBackdate": "1h5m"
            }
          },
          "issuers": [
            {
              "active": true,
              "location": {
                "configFile": "/etc/boulder/webpki/int-ecdsa-a.pkcs11.json",
                "certFile": "/etc/boulder/webpki/int-ecdsa-a.cert.pem",
                "numSessions": 2
              }
            }
          ]
        },

        "serialPrefixHex": "FF",
        "maxNames": 100,
        "goodkey": {},
        "features": {}
      },
      "syslog": {
        "stdoutLevel": 6,
        "syslogLevel": 6
      },
      "common": {
        "dnsResolver": "8.8.8.8:53",
        "dnsTimeout": "10s",
        "dnsAllowLoopbackAddresses": true,
        "tls": {
          "certFile": "/etc/boulder/tls/server/tls.crt",
          "keyFile": "/etc/boulder/tls/server/tls.key",
          "caCertFile": "/etc/boulder/tls/ca/tls.crt"
        }
      }
    }
