---
# Boulder Nonce Service Deployment
# Generates and validates single-use nonces for replay protection
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nonce-service
  namespace: boulder
  labels:
    app: nonce-service
    app.kubernetes.io/name: nonce-service
    app.kubernetes.io/component: nonce-service
    app.kubernetes.io/part-of: boulder
  annotations:
    boulder.io/ocsp-excluded: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nonce-service
  template:
    metadata:
      labels:
        app: nonce-service
        app.kubernetes.io/name: nonce-service
        app.kubernetes.io/component: nonce-service
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-redis
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for Redis..."
              until nslookup redis-client.boulder.svc.cluster.local; do
                echo "Waiting for Redis service..."
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: nonce-service
          image: boulder:latest
          command: ["boulder", "nonce-service"]
          args: ["--config", "/etc/boulder/nonce-service.json"]
          ports:
            - containerPort: 9501
              name: grpc
              protocol: TCP
            - containerPort: 8021
              name: debug
              protocol: TCP
          env:
            - name: BOULDER_CONFIG_DIR
              value: "/etc/boulder"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: redis-password
            # mTLS Environment Variables
            - name: BOULDER_GRPC_TLS_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_TLS_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_TLS_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: BOULDER_GRPC_CLIENT_CERT
              value: "/etc/boulder/tls/server/tls.crt"
            - name: BOULDER_GRPC_CLIENT_KEY
              value: "/etc/boulder/tls/server/tls.key"
            - name: BOULDER_GRPC_CLIENT_CA
              value: "/etc/boulder/tls/ca/tls.crt"
            - name: GRPC_GO_LOG_VERBOSITY_LEVEL
              value: "99"
            - name: GRPC_GO_LOG_SEVERITY_LEVEL
              value: "info"
          volumeMounts:
            - name: config
              mountPath: /etc/boulder
            - name: internal-certs
              mountPath: /etc/boulder/certs
              readOnly: true
            # mTLS Certificate Mounts
            - name: server-tls
              mountPath: /etc/boulder/tls/server
              readOnly: true
            - name: ca-tls
              mountPath: /etc/boulder/tls/ca
              readOnly: true
            # Redis Client Certificate Mounts
            - name: redis-client-tls
              mountPath: /etc/boulder/tls/redis-client
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /debug/health
              port: 8021
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /debug/health
              port: 8021
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: nonce-service-config
        - name: internal-certs
          secret:
            secretName: internal-pki
        # mTLS Certificate Volumes
        - name: server-tls
          secret:
            secretName: nonce-service-grpc-tls
            defaultMode: 0400  # Read-only for owner only
        - name: ca-tls
          secret:
            secretName: intermediate-ca-secret
            defaultMode: 0444  # Read-only for all
        # Redis Client Certificate Volume
        - name: redis-client-tls
          secret:
            secretName: redis-client-tls
            defaultMode: 0400  # Read-only for owner only
---
# Nonce Service
apiVersion: v1
kind: Service
metadata:
  name: nonce-service
  namespace: boulder
  labels:
    app: nonce-service
    app.kubernetes.io/name: nonce-service
    app.kubernetes.io/component: nonce-service
    app.kubernetes.io/part-of: boulder
spec:
  type: ClusterIP
  ports:
    - port: 9501
      targetPort: 9501
      protocol: TCP
      name: grpc
  selector:
    app: nonce-service
---
# Nonce Service ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: nonce-service-config
  namespace: boulder
  labels:
    app: nonce-service
    app.kubernetes.io/name: nonce-service
    app.kubernetes.io/component: nonce-service-config
data:
  nonce-service.json: |
    {
      "nonceService": {
        "grpcAddress": ":9501",
        "debugAddr": ":8021",
        "redis": {
          "server": "redis:6379",
          "password": "${REDIS_PASSWORD}",
          "maxRetries": 3,
          "timeout": "5s",
          "tls": {
            "enabled": true,
            "certFile": "/etc/boulder/tls/redis-client/tls.crt",
            "keyFile": "/etc/boulder/tls/redis-client/tls.key",
            "caCertFile": "/etc/boulder/tls/ca/tls.crt",
            "serverName": "redis.boulder.svc.cluster.local",
            "skipVerify": false
          }
        },
        "prefix": "boulder-k8s",
        "maxUsed": 65536
      },
      "syslog": {
        "stdoutLevel": 6,
        "syslogLevel": 6
      },
      "common": {
        "dnsResolver": "8.8.8.8:53",
        "dnsTimeout": "10s",
        "dnsAllowLoopbackAddresses": true,
        "tls": {
          "certFile": "/etc/boulder/tls/server/tls.crt",
          "keyFile": "/etc/boulder/tls/server/tls.key",
          "caCertFile": "/etc/boulder/tls/ca/tls.crt"
        }
      }
    }
