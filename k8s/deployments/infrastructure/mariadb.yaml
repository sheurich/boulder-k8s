---
# MariaDB StatefulSet for Boulder
# Primary database for all Boulder data storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: boulder
  labels:
    app: mariadb
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: boulder
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: mariadb
          image: mariadb:10.5
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: root-password
            - name: MYSQL_DATABASE
              value: boulder
            - name: MYSQL_USER
              value: boulder
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: boulder-password
            # Additional database for incidents
            - name: MYSQL_ADDITIONAL_DATABASES
              value: incidents
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              # TLS Certificate Mounts - TEMPORARILY DISABLED FOR HEALTH CHECK TESTING
              # - name: server-tls
              #   mountPath: /etc/mysql/tls/server
              #   readOnly: true
              # - name: ca-tls
              #   mountPath: /etc/mysql/tls/ca
              #   readOnly: true
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysql -h localhost -uroot -p$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: mariadb-config
        - name: init-scripts
          configMap:
            name: mariadb-init-scripts
            defaultMode: 0755
            # TLS Certificate Volumes - TEMPORARILY DISABLED FOR HEALTH CHECK TESTING
            # - name: server-tls
            #   secret:
            #     secretName: mariadb-server-tls
            #     defaultMode: 0400  # Read-only for owner only
            # - name: ca-tls
            #   secret:
            #     secretName: internal-pki
            #     defaultMode: 0444  # Read-only for all
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
        storageClassName: standard
---
# MariaDB Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-config
  namespace: boulder
  labels:
    app: mariadb
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database-config
data:
  custom.cnf: |
    [mysqld]
    # Performance tuning for Boulder workload
    innodb_buffer_pool_size = 1G
    innodb_log_file_size = 256M
    innodb_flush_log_at_trx_commit = 2
    innodb_flush_method = O_DIRECT

    # Connection limits
    max_connections = 1000
    max_user_connections = 900

    # Query cache (disabled for better performance)
    query_cache_type = 0
    query_cache_size = 0

    # Binary logging for replication readiness
    log_bin = mysql-bin
    binlog_format = ROW
    expire_logs_days = 7

    # Character set
    character_set_server = utf8mb4
    collation_server = utf8mb4_unicode_ci

    # Timeout settings
    wait_timeout = 28800
    interactive_timeout = 28800

    # Security
    skip_name_resolve = 1
    bind_address = 0.0.0.0

    # TLS Configuration - TEMPORARILY DISABLED FOR HEALTH CHECK TESTING
    # ssl_cert = /etc/mysql/tls/server/tls.crt
    # ssl_key = /etc/mysql/tls/server/tls.key
    # ssl_ca = /etc/mysql/tls/ca/minica.pem
    # require_secure_transport = ON
    # tls_version = TLSv1.2,TLSv1.3

    # TLS Cipher Configuration for Strong Security - TEMPORARILY DISABLED
    # ssl_cipher = ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384
---
# MariaDB Initialization Scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init-scripts
  namespace: boulder
  labels:
    app: mariadb
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database-init
data:
  01-create-databases.sh: |
    #!/bin/bash
    set -e

    echo "Creating additional databases..."

    # Create incidents database for security events
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" \
      -e "CREATE DATABASE IF NOT EXISTS incidents CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" \
      -e "GRANT ALL PRIVILEGES ON incidents.* TO 'boulder'@'%';"

    # Create read-only user for SA service
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" \
      -e "CREATE USER IF NOT EXISTS 'boulder_ro'@'%' IDENTIFIED BY '$MYSQL_PASSWORD';"
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" \
      -e "GRANT SELECT ON boulder.* TO 'boulder_ro'@'%';"
    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "GRANT SELECT ON incidents.* TO 'boulder_ro'@'%';"

    mysql -u root -p"$MYSQL_ROOT_PASSWORD" -e "FLUSH PRIVILEGES;"

    echo "Database initialization complete"

  02-boulder-schema.sql: |
    -- Boulder database schema initialization
    -- This will be populated with the actual Boulder schema
    -- For now, creating basic structure to validate connectivity

    USE boulder;

    -- Basic table for connection testing
    CREATE TABLE IF NOT EXISTS system_info (
        id INT AUTO_INCREMENT PRIMARY KEY,
        version VARCHAR(50),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO system_info (version) VALUES ('boulder-k8s-v1.0.0')
    ON DUPLICATE KEY UPDATE version=VALUES(version);
