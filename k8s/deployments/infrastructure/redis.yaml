---
# Redis StatefulSet for Boulder
# Used for rate limiting and nonce storage with sharding support
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: boulder
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: boulder
spec:
  serviceName: redis
  replicas: 2  # 2 instances for sharding
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      serviceAccountName: boulder-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: redis-password
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - redis-server
            - /etc/redis/redis.conf
            - --requirepass
            - $(REDIS_PASSWORD)
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
            # TLS Certificate Mounts
            - name: server-tls
              mountPath: /etc/redis/tls/server
              readOnly: true
            - name: ca-tls
              mountPath: /etc/redis/tls/ca
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - --no-auth-warning
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - --no-auth-warning
                - -a
                - $(REDIS_PASSWORD)
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: redis-config
        # TLS Certificate Volumes
        - name: server-tls
          secret:
            secretName: redis-server-tls
            defaultMode: 0400  # Read-only for owner only
        - name: ca-tls
          secret:
            secretName: intermediate-ca-secret
            defaultMode: 0444  # Read-only for all
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
        storageClassName: standard
---
# Redis Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: boulder
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache-config
data:
  redis.conf: |
    # Redis configuration for Boulder rate limiting and nonce storage

    # Network - TLS Configuration
    bind 0.0.0.0
    port 0
    tls-port 6379
    tcp-backlog 511

    # TLS Configuration
    tls-cert-file /etc/redis/tls/server/tls.crt
    tls-key-file /etc/redis/tls/server/tls.key
    tls-ca-cert-file /etc/redis/tls/ca/tls.crt
    tls-auth-clients yes
    tls-protocols "TLSv1.2 TLSv1.3"
    tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    tls-ciphers ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20:!aNULL:!MD5:!DSS
    tls-prefer-server-ciphers yes
    tls-session-caching no

    # Memory management
    maxmemory 256mb
    maxmemory-policy allkeys-lru

    # Persistence - disabled for performance (data is ephemeral)
    save ""
    appendonly no

    # Logging
    loglevel notice
    logfile ""

    # Client connection limits
    maxclients 1000
    timeout 300
    tcp-keepalive 300

    # Performance tuning
    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64

    # Security
    protected-mode yes

    # Disable dangerous commands
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
    rename-command DEBUG ""
    rename-command CONFIG ""
    rename-command SHUTDOWN SHUTDOWN_BOULDER
    rename-command EVAL ""

