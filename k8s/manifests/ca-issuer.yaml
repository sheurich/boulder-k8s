# Self-signed CA for mTLS certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# CA Certificate for Boulder mTLS
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: boulder-ca-cert
  namespace: default
spec:
  secretName: boulder-ca-secret
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  isCA: true
  commonName: "Boulder CA"
  subject:
    organizationalUnits:
      - "Boulder K8s"
    organizations:
      - "Let's Encrypt"
    countries:
      - "US"
  privateKey:
    algorithm: ECDSA
    size: 256
  secretTemplate:
    annotations:
      cert-manager.io/allow-direct-injection: "true"
    labels:
      boulder.io/ca-secret: "true"
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# CA Issuer using the generated CA certificate
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: boulder-ca-issuer
  namespace: default
spec:
  ca:
    secretName: boulder-ca-secret